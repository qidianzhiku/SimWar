name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR4_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PR4_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR4_EVIDENCE_ROOT: /tmp/simwar-pr4-quality-${{ github.run_id }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simwar_test
          POSTGRES_PASSWORD: simwar_test
          POSTGRES_DB: simwar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simwar_test -d simwar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify PR4 exact head
        run: node scripts/check-pr4-exact-head.mjs "$EXPECTED_PR_HEAD_SHA"
      - run: npm ci
      - run: npm run check:hidden-unicode
      - name: Check direct-store boundaries
        run: npm run check:direct-store-boundaries
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres-replay
        env:
          SIMWAR_TEST_DATABASE_URL: postgresql://simwar_test:simwar_test@localhost:5432/simwar_test
          SIMWAR_VERIFICATION_REPORT_PATH: artifacts/postgres-replay-verification.json
      - name: Validate Postgres replay verification report
        if: always() && hashFiles('artifacts/postgres-replay-verification.json') != ''
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const path = "artifacts/postgres-replay-verification.json";
          const raw = fs.readFileSync(path, "utf8");
          const report = JSON.parse(raw);

          const fail = (message) => {
            throw new Error(message);
          };

          if (report.schema_version !== 1) {
            fail("Unexpected verification report schema version");
          }

          if ("base_commit" in report) {
            fail("Obsolete base_commit field is present");
          }

          if ("ready_for_review" in report) {
            fail("Domain report must not emit ready_for_review");
          }

          if ("scope_valid" in report) {
            fail("Unverified scope_valid field is present");
          }

          if (report.scope?.status !== "unavailable") {
            fail("Scope status must be unavailable");
          }

          if (
            report.scope?.reason !==
            "Scope is not evaluated by the Postgres replay harness"
          ) {
            fail("Unexpected scope reason");
          }

          if (report.domain_harnesses?.postgres_replay?.status !== "passed") {
            fail("Postgres replay domain harness did not pass");
          }

          if (report.cleanup?.temporary_schema !== "passed") {
            fail("Temporary schema cleanup did not pass");
          }

          if (report.cleanup?.database_client !== "passed") {
            fail("Database client cleanup did not pass");
          }

          if (
            !Array.isArray(report.blocking_failures) ||
            report.blocking_failures.length !== 0
          ) {
            fail("Unexpected blocking failures");
          }

          if (report.postgres_replay_ready !== true) {
            fail("Postgres replay readiness is not true");
          }

          const command = report.commands?.find(
            (entry) => entry.name === "npm run test:postgres-replay",
          );

          if (!command || command.status !== "passed") {
            fail("Postgres replay command result is missing or failed");
          }

          if (
            !Number.isInteger(command.duration_ms) ||
            command.duration_ms < 0
          ) {
            fail("Invalid Postgres replay command duration");
          }

          if (
            raw.includes("postgresql://") ||
            raw.includes("simwar_test:simwar_test@")
          ) {
            fail("Database connection details leaked into report");
          }
          NODE
      - name: Upload Postgres replay verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-replay-verification
          path: artifacts/postgres-replay-verification.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run test:contract
      - run: npm run build
      - name: Prepare external PR4 quality evidence
        run: mkdir -p "$PR4_EVIDENCE_ROOT"
      - name: Measure PR4 frontend bundle budgets
        run: |
          npm run measure:frontend:budgets -- \
            --dist-root . \
            --output "$PR4_EVIDENCE_ROOT/budget-report.json" \
            --base-sha "$PR4_BASE_SHA" \
            --head-sha "$EXPECTED_PR_HEAD_SHA"
      - name: Upload PR4 quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4-quality-evidence
          path: ${{ env.PR4_EVIDENCE_ROOT }}
          if-no-files-found: ignore
          retention-days: 14
  browser-smoke:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR4_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PR4_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR4_EVIDENCE_ROOT: /tmp/simwar-pr4-browser-${{ github.run_id }}
      SIMWAR_PLAYWRIGHT_STORE_FILE: /tmp/simwar-playwright/pr4-${{ github.run_id }}/playwright-store.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify PR4 exact head
        run: node scripts/check-pr4-exact-head.mjs "$EXPECTED_PR_HEAD_SHA"
      - run: npm ci
      - name: Prepare external PR4 Playwright store
        run: mkdir -p "$(dirname "$SIMWAR_PLAYWRIGHT_STORE_FILE")"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit:pr4
      - name: Prepare exact PR4 BASE checkout
        run: |
          PR4_BASE_WORKTREE="/tmp/simwar-pr4-base-${GITHUB_RUN_ID}"
          echo "PR4_BASE_WORKTREE=$PR4_BASE_WORKTREE" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin "$PR4_BASE_SHA"
          git worktree add --detach "$PR4_BASE_WORKTREE" "$PR4_BASE_SHA"
          (cd "$PR4_BASE_WORKTREE" && npm ci && npm run build)
      - name: Capture exact PR4 visual baseline
        run: |
          npm run capture:pr4:baseline -- \
            --source-root "$PR4_BASE_WORKTREE" \
            --output "$PR4_EVIDENCE_ROOT/base-capture" \
            --expected-sha "$PR4_BASE_SHA" \
            --candidate-sha "$EXPECTED_PR_HEAD_SHA" \
            --store "/tmp/simwar-playwright/pr4-base-${GITHUB_RUN_ID}/playwright-store.json"
          mkdir -p "$PR4_EVIDENCE_ROOT/baseline"
          cp "$PR4_EVIDENCE_ROOT/base-capture/candidate/"*.png "$PR4_EVIDENCE_ROOT/baseline/"
      - run: npm run test:e2e:ui:core
      - run: npm run test:e2e:ui:pr4
      - name: Compare PR4 visual candidate against external baseline
        id: pr4-visual-browser
        run: |
          mkdir -p "$PR4_EVIDENCE_ROOT/baseline" "$PR4_EVIDENCE_ROOT/candidate" "$PR4_EVIDENCE_ROOT/diff"
          set +e
          npm run visual:pr4:manifest -- \
            --baseline "$PR4_EVIDENCE_ROOT/baseline" \
            --candidate "$PR4_EVIDENCE_ROOT/candidate" \
            --diff-root "$PR4_EVIDENCE_ROOT/diff" \
            --output "$PR4_EVIDENCE_ROOT/visual-manifest.json" \
            --base-sha "$PR4_BASE_SHA" \
            --head-sha "$EXPECTED_PR_HEAD_SHA" \
            --max-diff-pixel-ratio 0.01 \
            --role-threshold student=0.065
          visual_exit=$?
          set -e
          node - "$PR4_EVIDENCE_ROOT/visual-manifest.json" "$visual_exit" <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const comparatorExit = Number(process.argv[3]);
          if (manifest.status === "failed") {
            console.error("PR4 visual comparator found a threshold failure");
            process.exit(1);
          }
          if (manifest.status !== "passed" || comparatorExit !== 0) {
            console.error(`PR4 visual comparator did not pass (status=${manifest.status}, exit=${comparatorExit})`);
            process.exit(1);
          }
          NODE
      - name: Remove exact PR4 BASE checkout
        if: always()
        run: |
          if [ -n "${PR4_BASE_WORKTREE:-}" ] && [ -d "$PR4_BASE_WORKTREE" ]; then
            git worktree remove --force "$PR4_BASE_WORKTREE"
          fi
          git worktree prune
      - name: Upload Playwright smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-student-smoke
          path: tmp/playwright
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload PR4 browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr4-integration
          path: ${{ env.PR4_EVIDENCE_ROOT }}
          if-no-files-found: ignore
          retention-days: 14
