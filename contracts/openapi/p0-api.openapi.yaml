  /api/v1/bff/teacher/runs/{runId}/scenario-selection-readiness:
    get:
      operationId: R7_TEACHER_SCENARIO_SELECTION_READINESS_GET_V1
      summary: Read the Teacher-safe readiness projection for an exact run, ScenarioPackage and ParameterSet.
      description: Read-only Teacher BFF projection through the repository facade. It does not assign or activate a ScenarioPackage, mutate a ParameterSet, execute Replay, settle a round, expose student data, or return formal truth.
      security:
        - SessionBearer: []
      parameters:
        - name: runId
          in: path
