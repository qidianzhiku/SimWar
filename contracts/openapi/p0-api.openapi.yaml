        - { in: query, name: runId, required: false, schema: { type: string, minLength: 1 } }
        - { in: query, name: roundNo, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Admin Operating World audit projection.
          content:
            application/json:
