components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      description: Signed user session. Tenant scope is resolved by the server from this identity.
    InternalServiceBearer:
      type: http
      scheme: bearer
      description: Internal service token only. Public browser clients must not receive or use this credential.
    ServicePrincipalHeader:
      type: apiKey
      in: header
      name: X-Service-Principal
      description: Must identify the service kernel principal for internal settlement.
  schemas:
    D6TransferEvidence:
      $ref: "../schemas/d6-transfer-evidence.v1.json"
    D6TransferEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { const: OK }
        data: { type: object, additionalProperties: true }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    D5LearningExportBundle:
      $ref: "../schemas/d5-export.v1.json"
    D5ExportPreviewEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { const: OK }
        data: { type: object, additionalProperties: true }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    D5ExportBundleEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { const: OK }
        data: { $ref: "#/components/schemas/D5LearningExportBundle" }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    D5ExportListEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { const: OK }
        data: { type: object, additionalProperties: true }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    D5ExportJobEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { const: OK }
        data: { type: object, additionalProperties: true }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    D2EvidenceCaptureInput:
