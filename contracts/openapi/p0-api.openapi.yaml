          schema: { type: string, minLength: 1 }
        - name: scenarioPackageId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: parameterSetId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Exact Teacher-safe read-only readiness projection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - operation_id
                  - tenant_id
                  - course_id
                  - run_id
                  - scenario_package_id
                  - parameter_set_id
                  - eligible
                  - readiness_status
                  - compatibility_status
                  - provenance_status
                  - qa_status
                  - license_status
                  - calibration_status
                  - runtime_adapter_status
                  - no_go_reasons
                  - evidence_freshness
                  - explicit_non_proofs
                properties:
                  operation_id:
                    type: string
                    const: R7_TEACHER_SCENARIO_SELECTION_READINESS_GET_V1
                  tenant_id: { type: string }
                  course_id: { type: string }
                  run_id: { type: string }
                  scenario_package_id: { type: string }
                  parameter_set_id: { type: string }
                  eligible: { type: boolean }
                  readiness_status:
                    type: string
                    enum: [BLOCKED, READY]
                  compatibility_status: { type: string }
                  provenance_status: { type: string }
                  qa_status: { type: string }
                  license_status: { type: string }
                  calibration_status: { type: string }
                  runtime_adapter_status: { type: string }
                  no_go_reasons:
                    type: array
                    items: { type: string }
                  evidence_freshness:
                    type: object
                    additionalProperties: false
                    required: [collected_at, expires_at, is_expired]
                    properties:
                      collected_at:
                        type:
                          - string
                          - "null"
                      expires_at:
                        type:
                          - string
                          - "null"
                      is_expired: { type: boolean }
                  explicit_non_proofs:
                    type: array
                    items: { type: string }
        "400":
          description: Invalid or duplicate exact query identifiers.
        "401":
          description: Authentication required.
        "403":
          description: Teacher authority required.
        "404":
          description: Run, ScenarioPackage or ParameterSet context not found or out of scope.
        "409":
          description: Readiness implementation gate is blocked.
        "500":
          description: Internal error with a redacted endpoint-specific error envelope.
  /api/v1/bff/teacher/formal-scenario-package-catalog:
    get:
      operationId: TEACHER_FORMAL_SCENARIO_PACKAGE_CATALOG_GET_V1
      summary: List approved formal ScenarioPackage authority references for the authenticated Teacher tenant.
      description: Read-only Teacher BFF projection. It creates no binding, writes no formal authority state, activates no Scenario runtime, and executes no Replay or settlement.
      responses:
        "200":
          description: Approved formal ScenarioPackage references safe for a local Teacher draft selection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - operation_id
                  - candidates
                  - explicit_non_proofs
                properties:
                  operation_id:
                    type: string
                    const: TEACHER_FORMAL_SCENARIO_PACKAGE_CATALOG_GET_V1
                  candidates:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - scenario_package_reference
                        - parameter_set_reference
                        - status
                        - schema_version
                        - compatibility_metadata
                        - plugin_dependencies
                      properties:
                        scenario_package_reference:
                          type: object
                          additionalProperties: false
                          required: [tenant_id, scenario_package_id, version, content_digest]
                          properties:
                            tenant_id: { type: string }
                            scenario_package_id: { type: string }
                            version: { type: string }
                            content_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
                        parameter_set_reference:
                          type: object
                          additionalProperties: false
                          required: [parameter_set_id, version, content_digest]
                          properties:
                            parameter_set_id: { type: string }
                            version: { type: string }
                            content_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
                        status:
                          type: string
                          const: APPROVED
                        schema_version:
                          type: string
                        compatibility_metadata:
                          type: object
                          additionalProperties: { type: string }
                        plugin_dependencies:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [plugin_package_id, version]
                            properties:
                              plugin_package_id: { type: string }
                              version: { type: string }
                  explicit_non_proofs:
                    type: array
                    items: { type: string }
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
