components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      description: Signed user session. Tenant scope is resolved by the server from this identity.
    InternalServiceBearer:
      type: http
      scheme: bearer
      description: Internal service token only. Public browser clients must not receive or use this credential.
    ServicePrincipalHeader:
      type: apiKey
      in: header
      name: X-Service-Principal
      description: Must identify the service kernel principal for internal settlement.
  schemas:
    ProjectProfileEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data:
          $ref: "../schemas/project-profile.v1.json"
        message: { type: string }
        request_id: { type: string }
    ProjectAwareLaunchRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key, run_id]
      properties:
        idempotency_key: { type: string, minLength: 3, maxLength: 128 }
        run_id: { type: string, minLength: 1 }
    ProjectAwareReadinessEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data: { $ref: "#/components/schemas/ProjectAwareReadiness" }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    ProjectAwareReadiness:
      type: object
      additionalProperties: false
      required: [blockers, formal_binding, generated_at, schema_version, scope, state, teams]
      properties:
        schema_version: { const: project-aware-launch.v1 }
        scope: { $ref: "#/components/schemas/ProjectAwareScope" }
        state:
          enum: [BLOCKED, STALE, DEGRADED, READY, UNKNOWN_VERIFYING]
        blockers:
          type: array
          items: { $ref: "#/components/schemas/ProjectAwareBlocker" }
        teams:
          type: array
          items: { $ref: "#/components/schemas/ProjectAwareTeamReadiness" }
        formal_binding:
          $ref: "#/components/schemas/ProjectAwareFormalBinding"
        generated_at: { type: string, format: date-time }
    ProjectAwareScope:
      type: object
      additionalProperties: false
      required: [course_id, run_id, tenant_id]
      properties:
        tenant_id: { type: string, minLength: 1 }
        course_id: { type: string, minLength: 1 }
        run_id: { type: string, minLength: 1 }
    ProjectAwareBlocker:
      type: object
      additionalProperties: false
      required:
        [
          action,
          blocker_id,
          category,
          code,
          evidence_ref,
          freshness,
          impact,
          owner,
          reason,
          recovery_action,
          source_authority
        ]
      properties:
        blocker_id: { type: string, minLength: 1 }
        category:
          enum:
            [course, run, round, project_assignment, project_profile, role_workflow, formal_binding]
        code:
          enum:
            [
              MISSING_ASSIGNMENT,
              SCOPE_MISMATCH,
              CONFLICTING_ASSIGNMENT,
              STALE_PROFILE_DIGEST,
              RETIRED_PROFILE,
              MISSING_ROLE,
              ROUND_NOT_OPEN,
              UNKNOWN_FORMAL_STATUS,
              FORMAL_BINDING_MISMATCH,
              RUN_NOT_FOUND,
              COURSE_NOT_READY
            ]
        owner: { enum: [teacher, platform, team] }
        action: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        impact: { type: string, minLength: 1 }
        source_authority:
          enum:
            [
              Course,
              Run,
              Round,
              ProjectAssignment,
              ProjectProfile,
              RoleWorkflow,
              FormalCourseAuthorityBinding
            ]
        recovery_action: { type: string, minLength: 1 }
        freshness: { enum: [FRESH_SNAPSHOT, HISTORICAL_EXACT_REF, UNKNOWN] }
        evidence_ref: { type: string, minLength: 1 }
        waiver_policy: { type: string, minLength: 1 }
        detail: { type: string }
    ProjectAwareFormalBinding:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { enum: [BOUND, UNKNOWN] }
        binding_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
    ProjectAwareTeamReadiness:
      type: object
      additionalProperties: false
      required:
        [assigned_role_keys, blockers, role_keys, state, successor_available, team_id, team_name]
      properties:
        team_id: { type: string, minLength: 1 }
        team_name: { type: string, minLength: 1 }
        state: { enum: [BLOCKED, STALE, DEGRADED, READY, UNKNOWN_VERIFYING] }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/ProjectAwareBlocker" }
        role_keys: { type: array, items: { type: string, minLength: 1 } }
        assigned_role_keys: { type: array, items: { type: string, minLength: 1 } }
        project_profile_reference:
          $ref: "../schemas/project-profile.v1.json#/$defs/projectProfileRef"
        successor_available: { type: boolean }
    ProjectAwareLaunchReceiptEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data: { $ref: "../schemas/project-aware-launch.v1.json" }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    ProjectAwareStudentContextEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data: { $ref: "#/components/schemas/ProjectAwareStudentContext" }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    ProjectAwareStudentContext:
      type: object
      additionalProperties: false
      required: [decision_context_evidence, project_brief, role_context, schema_version, scope]
      properties:
        schema_version: { const: project-aware-launch.v1 }
        course_factory_source_evidence:
          $ref: "#/components/schemas/CourseFactoryStudentEvidenceProjection"
        decision_context_evidence:
          $ref: "#/components/schemas/StudentDecisionContextEvidence"
        scope:
          type: object
          additionalProperties: false
          required: [course_id, run_id, team_id, tenant_id]
          properties:
            tenant_id: { type: string, minLength: 1 }
            course_id: { type: string, minLength: 1 }
            run_id: { type: string, minLength: 1 }
            team_id: { type: string, minLength: 1 }
        role_context:
          type: object
          additionalProperties: false
          required:
            [
              assignment_id,
              course_id,
              expires_at,
              permissions,
              role_context_id,
              role_key,
              role_template_id,
              round_id,
              round_no,
              run_id,
              source,
              team_id,
              tenant_id,
              user_id
            ]
          properties:
            role_context_id: { type: string, minLength: 1 }
            tenant_id: { type: string, minLength: 1 }
            user_id: { type: string, minLength: 1 }
            course_id: { type: string, minLength: 1 }
            run_id: { type: string, minLength: 1 }
            round_id: { type: string, minLength: 1 }
            round_no: { type: integer, minimum: 1 }
            team_id: { type: string, minLength: 1 }
            assignment_id: { type: string, minLength: 1 }
            role_key: { type: string, minLength: 1 }
            role_template_id: { type: string, minLength: 1 }
            permissions: { type: object }
            source: { const: resolved_from_assignment }
            expires_at: { type: string, format: date-time }
        project_brief:
          type: object
          additionalProperties: false
          required:
            [
              brief_kind,
              customer_segment,
              description,
              geography,
              industry,
              known_limits,
              market_world_reference,
              positioning,
              project_profile_reference,
              service_bundle,
              title
            ]
          properties:
            brief_kind: { const: PROJECT_BRIEF }
            customer_segment: { type: string }
            description: { type: string }
            geography: { type: string }
            industry: { type: string }
            known_limits: { type: array, items: { type: string } }
            market_world_reference:
              $ref: "../schemas/market-world.v1.json#/$defs/marketWorldRef"
            positioning: { type: string }
            project_profile_reference:
              $ref: "../schemas/project-profile.v1.json#/$defs/projectProfileRef"
            service_bundle: { type: string }
            title: { type: string }
    CourseFactoryStudentEvidenceProjection:
      type: object
      additionalProperties: false
      required:
        [
          consumption_status,
          epoch_version,
          exact_binding_required,
          qualification_status,
          target_region
        ]
      properties:
        target_region: { const: Hangzhou }
        epoch_version: { type: string, minLength: 1 }
        qualification_status: { const: LIMITED }
        consumption_status: { const: LOOKAHEAD_READY }
        exact_binding_required: { const: true }
    StudentDecisionContextEvidence:
      $ref: "../schemas/student-decision-context-evidence.v1.json"
    ProjectAwareAdminAuditEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data:
          type: object
          additionalProperties: false
          required: [lineage, project_library, readiness]
          properties:
            project_library:
              type: object
              additionalProperties: true
              required: [assignments, profiles, tenant_id]
              properties:
                assignments: { type: array, items: { type: object } }
                profiles: { type: array, items: { type: object } }
                tenant_id: { type: string, minLength: 1 }
            readiness: { $ref: "#/components/schemas/ProjectAwareReadiness" }
            lineage:
              type: array
              items: { $ref: "../schemas/project-aware-launch.v1.json" }
        message: { type: string }
        request_id: { type: string, minLength: 1 }
    TeachingClosureEnvelope:
      type: object
      required: [code, data, message, request_id]
      properties:
        code: { const: OK }
        message: { type: string }
        request_id: { type: string }
        data:
          $ref: "../schemas/teaching-closure.v1.json"
    D6TransferEvidence:
      $ref: "../schemas/d6-transfer-evidence.v1.json"
    W020AdvisoryRequest:
      type: object
      additionalProperties: false
      required: [discriminator, surface, run_id, round_id, team_id, idempotency_key]
      properties:
        discriminator: { const: w020_advisory_request }
        surface: { enum: [student_role, teacher_debrief] }
        run_id: { type: string, minLength: 1 }
        round_id: { type: string, minLength: 1 }
        team_id: { type: string, minLength: 1 }
        role_key: { enum: [CEO, CFO, CMO, COO, CHRO] }
        idempotency_key: { type: string, minLength: 1 }
    W020AdvisoryEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data:
          $ref: "../schemas/w020-governed-ai-advisory.v1.json"
        message: { type: string }
        request_id: { type: string }
    W020AdvisoryAuditEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data:
          type: object
          additionalProperties: false
          required: [entries, known_limits]
          properties:
            entries: { type: array, items: { type: object } }
            known_limits: { type: array, items: { type: string } }
        message: { type: string }
        request_id: { type: string }
    W3OfficialConsequenceEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data: { $ref: "#/components/schemas/W3OfficialConsequenceResponse" }
        message: { type: string }
        request_id: { type: string }
    W3OfficialConsequenceResponse:
      type: object
      additionalProperties: false
      required: [known_limits, record, runtime_authority, visibility]
      properties:
        known_limits: { type: array, minItems: 1, items: { type: string } }
        record: { $ref: "../schemas/w3-official-consequence-learning.v1.json" }
        runtime_authority: { const: JSON_INTERNAL_ONLY }
        visibility: { enum: [student_safe, teacher_safe] }
    OperatingWorldConsequenceTrace:
      $ref: "../schemas/operating-world-consequence-trace.v1.json"
    M2P5DecisionLearningEnvelope:
      type: object
      additionalProperties: false
      required: [code, data, message, request_id]
      properties:
        code: { type: string }
        data: { $ref: "#/components/schemas/M2P5DecisionLearningResponse" }
        message: { type: string }
        request_id: { type: string }
    M2P5DecisionLearningResponse:
      $ref: "../schemas/m2p5-decision-learning-crossround.v1.json"
    O4CrossRoundDynamicsEnvelope:
      type: object
