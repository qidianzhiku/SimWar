      required: [tenant_id, scenario_package_id, version, content_digest]
      properties:
        tenant_id:
          type: string
          minLength: 1
        scenario_package_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        content_digest:
          type: string
