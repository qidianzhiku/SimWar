openapi: 3.1.0
info:
  title: SimWar P0/P1 API
  version: 0.1.0
  description: Minimal P0/P1 contract for the teacher-student-settlement loop plus tenant auth governance.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/auth/login:
    post:
      summary: Login and receive a signed session token.
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1AuthSessionEnvelope"
        "401":
          description: Missing, malformed, or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/auth/logout:
    post:
      summary: Revoke the current signed session.
      responses:
        "200":
          description: Session revoked
  /api/v1/auth/me:
    get:
      summary: Return the current authenticated user and effective permissions.
      responses:
        "200":
          description: Current user
  /api/v1/admin/state:
    get:
      summary: Return tenant, user, RBAC and audit state for an admin cockpit.
      responses:
        "200":
          description: Admin state
  /api/v1/admin/tenants:
    get:
      summary: List tenants visible to the current administrator.
      responses:
        "200":
          description: Tenant list
    post:
      summary: Create a tenant. Requires platform_admin and tenant:create.
      responses:
        "201":
          description: Tenant created
        "403":
          description: Missing tenant:create permission
  /api/v1/admin/tenants/{tenantId}:
    get:
      summary: Read one tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant detail
  /api/v1/admin/users:
    get:
      summary: List users in the current tenant, or all users for platform_admin.
      responses:
        "200":
          description: User list
    post:
      summary: Create a tenant-scoped user and assign roles.
      responses:
        "201":
          description: User created
        "403":
          description: Role escalation or permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: Missing required user credential or invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/admin/users/{userId}:
    patch:
      summary: Update a user profile, status, password or roles with field-level checks.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User updated
        "403":
          description: Tenant boundary, role escalation or protected field violation
  /api/v1/rbac/roles:
    get:
      summary: List RBAC roles and their permission keys.
      responses:
        "200":
          description: Role list
  /api/v1/rbac/permissions:
    get:
      summary: List platform permission keys.
      responses:
        "200":
          description: Permission list
  /api/v1/courses:
    get:
      summary: List courses in the current tenant.
      responses:
        "200":
          description: Course list
    post:
      summary: Create a draft course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreateInput"
      responses:
        "201":
          description: Course created
  /api/v1/courses/{courseId}/publish:
    post:
      summary: Publish a course after scenario and parameter checks.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course published
  /api/v1/courses/{courseId}/teams:
    post:
      summary: Create a team for a course.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Team created
  /api/v1/courses/{courseId}/runs:
    post:
      summary: Create a run and first draft round.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateInput"
      responses:
        "201":
          description: Run and round created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RunCreateEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Teacher run-create authority required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/start:
    post:
      summary: Start a draft round.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RoundEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/decisions:
    post:
      summary: Submit a validated team decision.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/M1DecisionSubmitRequest"
      responses:
        "201":
          description: Decision accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1DecisionSubmitSuccessEnvelope"
        "403":
          description: Student is not authorized for the requested team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: Run, round, or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: Round is no longer open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: Decision validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/lock:
    post:
      summary: Lock a round for settlement.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RoundEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/settle:
    post:
      summary: Teacher command that requests structured-core settlement.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1SettlementResultEnvelope"
  /api/v1/bff/teacher/runs/{runId}/scenario-package-candidates:
    get:
      operationId: R7_TEACHER_SCENARIO_PACKAGE_CANDIDATES_GET_V1
      summary: List the Teacher-safe ScenarioPackage candidates for a run tenant.
      description: Read-only Teacher BFF projection. It does not assign or activate a ScenarioPackage, mutate a ParameterSet, execute Replay, or settle a round.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Minimal run-scoped ScenarioPackage candidate projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - run_id
                  - current_scenario_package_id
                  - candidates
                properties:
                  run_id:
                    type: string
                  current_scenario_package_id:
                    type:
                      - string
                      - "null"
                  candidates:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - scenario_package_id
                        - display_name
                        - version_label
                        - is_current
                      properties:
                        scenario_package_id:
                          type: string
                        display_name:
                          type: string
                        version_label:
                          type: string
                        is_current:
                          type: boolean
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
        "404":
          description: Run context not found or out of scope
        "503":
          description: Scenario candidate provider capability unavailable
  /api/v1/bff/teacher/formal-scenario-package-catalog:
    get:
      operationId: TEACHER_FORMAL_SCENARIO_PACKAGE_CATALOG_GET_V1
      summary: List approved formal ScenarioPackage authority references for the authenticated Teacher tenant.
      description: Read-only Teacher BFF projection. It creates no binding, writes no formal authority state, activates no Scenario runtime, and executes no Replay or settlement.
      responses:
        "200":
          description: Approved formal ScenarioPackage references safe for a local Teacher draft selection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - operation_id
                  - candidates
                  - explicit_non_proofs
                properties:
                  operation_id:
                    type: string
                    const: TEACHER_FORMAL_SCENARIO_PACKAGE_CATALOG_GET_V1
                  candidates:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - scenario_package_reference
                        - parameter_set_reference
                        - status
                        - schema_version
                        - compatibility_metadata
                        - plugin_dependencies
                      properties:
                        scenario_package_reference:
                          type: object
                          additionalProperties: false
                          required: [tenant_id, scenario_package_id, version, content_digest]
                          properties:
                            tenant_id: { type: string }
                            scenario_package_id: { type: string }
                            version: { type: string }
                            content_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
                        parameter_set_reference:
                          type: object
                          additionalProperties: false
                          required: [parameter_set_id, version, content_digest]
                          properties:
                            parameter_set_id: { type: string }
                            version: { type: string }
                            content_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
                        status:
                          type: string
                          const: APPROVED
                        schema_version:
                          type: string
                        compatibility_metadata:
                          type: object
                          additionalProperties: { type: string }
                        plugin_dependencies:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [plugin_package_id, version]
                            properties:
                              plugin_package_id: { type: string }
                              version: { type: string }
                  explicit_non_proofs:
                    type: array
                    items: { type: string }
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
  /api/v1/bff/teacher/formal-course-bindings/preview:
    post:
      operationId: TEACHER_FORMAL_COURSE_BINDING_PREVIEW_V1
      summary: Resolve a Teacher-safe, exact formal Course binding preview.
      description: The server re-resolves the selected immutable ScenarioPackage reference, its exact ParameterSet, available Plugin releases and the active JSON Engine profile. This endpoint is read-only.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherFormalCourseBindingPreviewInput"
      responses:
        "200":
          description: Exact formal binding preview without a Course or Run write.
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
        "422":
          description: Selected formal authority reference is unavailable or incompatible
  /api/v1/bff/teacher/formal-courses:
    post:
      operationId: TEACHER_FORMAL_COURSE_CREATE_V1
      summary: Create a formal-bound Course from one selected ScenarioPackage reference.
      description: The server resolves all hidden authority references and persists an append-only Course binding. Clients cannot submit Engine, ParameterSet or Plugin overrides.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherFormalCourseSelectionInput"
      responses:
        "201":
          description: Draft Course with a Teacher-safe formal binding summary.
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
        "422":
          description: Selected formal authority reference is unavailable or incompatible
  /api/v1/bff/teacher/course-blueprints:
    get:
      operationId: TEACHER_COURSE_BLUEPRINT_CATALOG_V1
      summary: List Teacher-safe approved CourseBlueprint versions for the request tenant.
      description: Read-only catalog. It excludes approval records, audit data, binding digests, and instructor-only guidance.
      security:
        - SessionBearer: []
      responses:
        "200": { description: "Teacher-safe approved CourseBlueprint catalog" }
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
  /api/v1/bff/teacher/course-blueprints/readiness:
    post:
      operationId: TEACHER_COURSE_BLUEPRINT_READINESS_V1
      summary: Resolve exact approved CourseBlueprint and B5 inputs without a write.
      description: Client-supplied Engine, ParameterSet, Plugin, and binding digest overrides are ignored; the server resolves every hidden formal input from exact authority references.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCourseBlueprintReadinessInput"
      responses:
        "200": { description: "Exact CourseBlueprint and formal Course readiness" }
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
        "422": { description: "Reference unavailable, retired, cross-tenant, or incompatible" }
  /api/v1/bff/teacher/course-blueprint-courses:
    post:
      operationId: TEACHER_COURSE_BLUEPRINT_COURSE_CREATE_V1
      summary: Create a draft Course with independent Blueprint and B5 formal bindings.
      description: Client-supplied hidden authority overrides are ignored and resolved server-side. JSON compensation removes the C1 binding when B5 creation fails; it is not a crash-safe durable transaction.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCourseBlueprintCourseCreateInput"
      responses:
        "201": { description: "Draft Course with Teacher-safe exact binding summaries" }
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
        "422": { description: "Invalid or unavailable exact authority inputs" }
  /api/v1/formal-authority/course-blueprints:
    post:
      operationId: FORMAL_COURSE_BLUEPRINT_DRAFT_CREATE_V1
      summary: Platform-admin-only CourseBlueprint DRAFT lifecycle ingress.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/course-blueprint-version.v1.json"
      responses:
        "201": { description: "Formal CourseBlueprint DRAFT" }
        "401": { description: "Authentication required" }
        "403": { description: "CourseBlueprint authority required" }
        "422": { description: "Invalid exact tenant-scoped draft" }
  /api/v1/formal-authority/course-blueprints/{courseBlueprintId}/versions/{version}/validate:
    post:
      operationId: FORMAL_COURSE_BLUEPRINT_VALIDATE_V1
      summary: Validate one exact CourseBlueprint lifecycle reference.
      security:
        - SessionBearer: []
      parameters:
        - name: courseBlueprintId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalCourseBlueprintReferenceInput"
      responses:
        "200": { description: "Lifecycle transition result" }
        "401": { description: "Authentication required" }
        "403": { description: "CourseBlueprint authority required" }
        "404": { description: "Exact CourseBlueprint reference not found" }
        "409": { description: "Lifecycle transition conflict" }
        "422": { description: "Invalid exact CourseBlueprint reference" }
  /api/v1/formal-authority/course-blueprints/{courseBlueprintId}/versions/{version}/freeze:
    post:
      operationId: FORMAL_COURSE_BLUEPRINT_FREEZE_V1
      summary: Freeze one exact validated CourseBlueprint lifecycle reference.
      security:
        - SessionBearer: []
      parameters:
        - name: courseBlueprintId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalCourseBlueprintReferenceInput"
      responses:
        "200": { description: "Lifecycle transition result" }
        "401": { description: "Authentication required" }
        "403": { description: "CourseBlueprint authority required" }
        "404": { description: "Exact CourseBlueprint reference not found" }
        "409": { description: "Lifecycle transition conflict" }
        "422": { description: "Invalid exact CourseBlueprint reference" }
  /api/v1/formal-authority/course-blueprints/{courseBlueprintId}/versions/{version}/approve:
    post:
      operationId: FORMAL_COURSE_BLUEPRINT_APPROVE_V1
      summary: Approve one exact frozen CourseBlueprint lifecycle reference.
      description: approval_id is mandatory. Approval never selects latest and never auto-approves.
      security:
        - SessionBearer: []
      parameters:
        - name: courseBlueprintId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalCourseBlueprintApprovalInput"
      responses:
        "200": { description: "Lifecycle transition result" }
        "401": { description: "Authentication required" }
        "403": { description: "CourseBlueprint authority required" }
        "404": { description: "Exact CourseBlueprint reference not found" }
        "409": { description: "Lifecycle transition conflict" }
        "422": { description: "Invalid exact CourseBlueprint approval input" }
  /api/v1/formal-authority/course-blueprints/{courseBlueprintId}/versions/{version}/retire:
    post:
      operationId: FORMAL_COURSE_BLUEPRINT_RETIRE_V1
      summary: Retire one exact approved CourseBlueprint lifecycle reference.
      security:
        - SessionBearer: []
      parameters:
        - name: courseBlueprintId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalCourseBlueprintReferenceInput"
      responses:
        "200": { description: "Lifecycle transition result" }
        "401": { description: "Authentication required" }
        "403": { description: "CourseBlueprint authority required" }
        "404": { description: "Exact CourseBlueprint reference not found" }
        "409": { description: "Lifecycle transition conflict" }
        "422": { description: "Invalid exact CourseBlueprint reference" }
  /api/v1/formal-authority/parameter-sets:
    post:
      operationId: FORMAL_PARAMETER_SET_DRAFT_CREATE_V1
      summary: Create a formal ParameterSet draft for the request tenant.
      description: Platform-admin governance ingress only. It appends a DRAFT lifecycle snapshot through the formal authority command service. It does not activate a runtime, bind a Run, execute Replay, or settle.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalParameterSetDraftInput"
      responses:
        "201":
          description: Formal DRAFT ParameterSet version
        "401":
          description: Authentication required
        "403":
          description: parameter_set:manage permission required
        "422":
          description: Invalid tenant-scoped formal ParameterSet draft
  /api/v1/formal-authority/parameter-sets/{parameterSetId}/versions/{version}/{action}:
    post:
      operationId: FORMAL_PARAMETER_SET_LIFECYCLE_TRANSITION_V1
      summary: Transition one exact formal ParameterSet reference.
      description: Platform-admin governance ingress only. The request body must carry the exact immutable reference and request tenant. Supported transitions are validate, freeze, approve, and retire.
      security:
        - SessionBearer: []
      parameters:
        - name: parameterSetId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [validate, freeze, approve, retire]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/FormalParameterSetReferenceInput"
                - $ref: "#/components/schemas/FormalParameterSetApprovalInput"
      responses:
        "200":
          description: Transitioned formal ParameterSet version or approval result
        "401":
          description: Authentication required
        "403":
          description: parameter_set:manage permission required
        "404":
          description: Exact formal ParameterSet version not found
        "409":
          description: Lifecycle transition conflicts with the current immutable snapshot
        "422":
          description: Invalid exact reference, tenant scope, or approval input
  /api/v1/formal-authority/scenario-packages/compile-draft:
    post:
      operationId: FORMAL_SCENARIO_PACKAGE_COMPILE_DRAFT_V1
      summary: Compile a generic ScenarioPackage candidate and append only its formal DRAFT snapshot.
      description: Platform-admin governance ingress only. A valid generic compiler candidate is passed to the existing ScenarioPackage command service. This endpoint never validates, freezes, approves, activates a runtime, or binds a Run.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericScenarioCompileDraftInput"
      responses:
        "201":
          description: Deterministic compiler report and a formal DRAFT ScenarioPackage version with matching content digest
        "401":
          description: Authentication required
        "403":
          description: scenario_package:manage permission required
        "409":
          description: The exact ParameterSet is not currently approved and bindable, or the immutable ScenarioPackage identity conflicts
        "422":
          description: Machine-readable invalid compiler report with no persisted ScenarioPackage lifecycle snapshot
  /api/v1/formal-authority/scenario-packages:
    post:
      operationId: FORMAL_SCENARIO_PACKAGE_DRAFT_CREATE_V1
      summary: Create a formal ScenarioPackage draft for the request tenant.
      description: Platform-admin governance ingress only. It appends a DRAFT lifecycle snapshot through the formal authority command service. It neither activates a runtime nor binds a Run, executes Replay, or settles.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalScenarioPackageDraftInput"
      responses:
        "201":
          description: Formal DRAFT ScenarioPackage version
        "401":
          description: Authentication required
        "403":
          description: scenario_package:manage permission required
        "409":
          description: The bound ParameterSet is not currently approved and bindable
        "422":
          description: Invalid tenant-scoped formal ScenarioPackage draft
  /api/v1/formal-authority/scenario-packages/{scenarioPackageId}/versions/{version}/{action}:
    post:
      operationId: FORMAL_SCENARIO_PACKAGE_LIFECYCLE_TRANSITION_V1
      summary: Transition one exact formal ScenarioPackage reference.
      description: Platform-admin governance ingress only. The request body must carry the exact immutable reference and request tenant. Supported transitions are validate, freeze, approve, and retire.
      security:
        - SessionBearer: []
      parameters:
        - name: scenarioPackageId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [validate, freeze, approve, retire]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/FormalScenarioPackageReferenceInput"
                - $ref: "#/components/schemas/FormalScenarioPackageApprovalInput"
      responses:
        "200":
          description: Transitioned formal ScenarioPackage version or approval result
        "401":
          description: Authentication required
        "403":
          description: scenario_package:manage permission required
        "404":
          description: Exact formal ScenarioPackage version not found
        "409":
          description: Lifecycle transition conflicts with the current immutable snapshot or bound ParameterSet
        "422":
          description: Invalid exact reference, tenant scope, or approval input
  /api/v1/formal-authority/plugin-releases:
    post:
      operationId: FORMAL_PLUGIN_RELEASE_DRAFT_CREATE_V1
      summary: Create a formal PluginRelease draft.
      description: Platform-admin governance ingress only. It appends a DRAFT lifecycle snapshot and never loads, executes, activates, or hot-swaps a plugin runtime.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalPluginReleaseDraftInput"
      responses:
        "201":
          description: Formal DRAFT PluginRelease version
        "401":
          description: Authentication required
        "403":
          description: plugin_release:manage permission required
        "422":
          description: Invalid formal PluginRelease draft
  /api/v1/formal-authority/plugin-releases/{pluginPackageId}/versions/{version}/{action}:
    post:
      operationId: FORMAL_PLUGIN_RELEASE_LIFECYCLE_TRANSITION_V1
      summary: Transition one exact formal PluginRelease reference.
      description: Platform-admin governance ingress only. AVAILABLE is an append-only availability record for formal binding; it does not activate a plugin runtime.
      security:
        - SessionBearer: []
      parameters:
        - name: pluginPackageId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [validate, approve, make-available, retire]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/FormalPluginReleaseReferenceInput"
                - $ref: "#/components/schemas/FormalPluginReleaseApprovalInput"
                - $ref: "#/components/schemas/FormalPluginReleaseAvailabilityInput"
      responses:
        "200":
          description: Transitioned formal PluginRelease version or its governance record
        "401":
          description: Authentication required
        "403":
          description: PluginRelease authority required
        "404":
          description: Exact formal PluginRelease version not found
        "409":
          description: Lifecycle transition conflicts with the current immutable snapshot
        "422":
          description: Invalid exact reference, manifest, or governance decision input
  /api/v1/bff/admin/run-lifecycle-controls:
    get:
      operationId: SYNTHETIC_RUN_LIFECYCLE_CONTROLS_LIST_V1
      summary: List tenant-scoped synthetic JSON pre-settlement lifecycle controls.
      description: Tenant Admin only. Tenant authority comes from the authenticated session, never a client-supplied tenant identifier. This projection contains no formal truth or private Replay payload.
      security:
        - SessionBearer: []
      responses:
        "200":
          description: Authenticated tenant-scoped lifecycle controls
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data, request_id]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyntheticRunLifecycleControl"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Tenant Admin lifecycle authority required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/bff/admin/courses/{courseId}/runs/{runId}/lifecycle/{operation}:
    post:
      operationId: SYNTHETIC_RUN_LIFECYCLE_OPERATION_POST_V1
      summary: Apply one bounded pre-settlement lifecycle operation.
      description: ABORT freezes evidence and blocks run progress. RESET may only reopen the transient round lock control. CLEANUP writes an evidence-sealed tombstone and deletes zero persisted artifacts in v1. Settled or published runs fail closed.
      security:
        - SessionBearer: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: operation
          in: path
          required: true
          schema:
            type: string
            enum: [abort, reset, cleanup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: Exact uppercase operation followed by one space and the run ID, for example ABORT run_001.
      responses:
        "200":
          description: Operation completed or returned idempotently
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, data, request_id]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                  data:
                    $ref: "#/components/schemas/SyntheticRunLifecycleOperationResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Tenant or role boundary denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: Run is absent or outside the authenticated tenant/course scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: Runtime, lifecycle, settlement, publication, evidence-freeze, or state transition boundary denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: Exact operation confirmation is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /internal/v1/runs/{runId}/rounds/{roundNo}/settle:
    post:
      summary: Internal structured-core-only settlement entrypoint.
      description: Internal service-principal-only operation. It is not a public browser/client API and must not be generated into Teacher, Student, or Admin frontend clients.
      x-simwar-internal: true
      x-simwar-public-client: false
      x-simwar-service-principal-only: true
      security:
        - InternalServiceBearer: []
          ServicePrincipalHeader: []
      parameters:
        - name: X-Service-Principal
          in: header
          required: true
          schema:
            const: service_kernel
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1SettlementResultEnvelope"
        "403":
          description: Service-principal credential is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/publish:
    post:
      summary: Publish a settled round.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RoundEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/results:
    get:
      summary: Read role-trimmed round results.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
