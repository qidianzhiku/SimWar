openapi: 3.1.0
info:
  title: SimWar P0/P1 API
  version: 0.1.0
  description: Minimal P0/P1 contract for the teacher-student-settlement loop plus tenant auth governance.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/auth/login:
    post:
      summary: Login and receive a signed session token.
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1AuthSessionEnvelope"
        "401":
          description: Missing, malformed, or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/auth/logout:
    post:
      summary: Revoke the current signed session.
      responses:
        "200":
          description: Session revoked
  /api/v1/auth/me:
    get:
      summary: Return the current authenticated user and effective permissions.
      responses:
        "200":
          description: Current user
  /api/v1/admin/state:
    get:
      summary: Return tenant, user, RBAC and audit state for an admin cockpit.
      responses:
        "200":
          description: Admin state
  /api/v1/admin/course-package-versions:
    get:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_LIST_V1
      summary: List tenant-scoped CoursePackageVersion lifecycle snapshots for administration.
      description: JSON-internal teaching/configuration records only. This does not expose a student route or modify source authority lifecycles.
      security:
        - SessionBearer: []
      responses:
        "200":
          description: Admin CoursePackageVersion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminListEnvelope"
        "401": { description: "Authentication required" }
        "403": { description: "Admin authority required" }
  /api/v1/admin/course-package-versions/drafts:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_DRAFT_CREATE_V1
      summary: Create one immutable DRAFT teaching package with closed exact source references.
      description: Tenant and actor are derived from the authenticated request. Existing CourseBlueprint, ScenarioPackage, ParameterSet, Course, and Run records are never written.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionDraftInput"
      responses:
        "201":
          description: Immutable DRAFT CoursePackageVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "401": { description: "Authentication required" }
        "403": { description: "Admin authority required" }
        "409": { description: "Exact package version already exists" }
        "422": { description: "Invalid closed reference or package content" }
  /api/v1/admin/course-package-versions/clone:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_CLONE_V1
      summary: Clone one exact AVAILABLE teaching package into a new immutable DRAFT.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionCloneInput"
      responses:
        "201":
          description: Cloned DRAFT CoursePackageVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact AVAILABLE source package not found" }
        "409":
          {
            description: "Target exact package version already exists or source package is not AVAILABLE"
          }
        "422": { description: "Source is not an exact AVAILABLE package" }
  /api/v1/admin/course-package-versions/import:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_IMPORT_V1
      summary: Import a digest-verified export as a new immutable DRAFT package version.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionImportInput"
      responses:
        "201":
          description: Imported DRAFT CoursePackageVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "409": { description: "Exact package version already exists" }
        "422": { description: "Import digest or source content is invalid" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/validate:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_VALIDATE_V1
      summary: Validate a DRAFT package against existing approved exact references.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionReferenceInput"
      responses:
        "200":
          description: VALIDATED CoursePackageVersion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact package version not found" }
        "409": { description: "Illegal package lifecycle transition" }
        "422": { description: "Dependency is unavailable or incompatible" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/make-available:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_AVAILABLE_V1
      summary: Mark one VALIDATED package AVAILABLE after a repeat dependency check.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionReferenceInput"
      responses:
        "200":
          description: AVAILABLE CoursePackageVersion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact package version not found" }
        "409": { description: "Illegal package lifecycle transition" }
        "422": { description: "Dependency is unavailable or incompatible" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/retire:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_RETIRE_V1
      summary: Retire one exact AVAILABLE teaching package without altering historical Courses.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionReferenceInput"
      responses:
        "200":
          description: RETIRED CoursePackageVersion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact package version not found" }
        "409": { description: "Illegal package lifecycle transition" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/export:
    get:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_EXPORT_V1
      summary: Export one exact AVAILABLE immutable teaching package.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
        - name: content_digest
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Digest-verified CoursePackageVersion export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionExportEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact AVAILABLE package not found" }
  /api/v1/admin/tenants:
    get:
      summary: List tenants visible to the current administrator.
      responses:
        "200":
          description: Tenant list
    post:
      summary: Create a tenant. Requires platform_admin and tenant:create.
      responses:
        "201":
          description: Tenant created
        "403":
          description: Missing tenant:create permission
  /api/v1/admin/tenants/{tenantId}:
    get:
      summary: Read one tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant detail
  /api/v1/admin/users:
    get:
      summary: List users in the current tenant, or all users for platform_admin.
      responses:
        "200":
          description: User list
    post:
      summary: Create a tenant-scoped user and assign roles.
      responses:
        "201":
          description: User created
        "403":
          description: Role escalation or permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: Missing required user credential or invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/admin/users/{userId}:
    patch:
      summary: Update a user profile, status, password or roles with field-level checks.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User updated
        "403":
          description: Tenant boundary, role escalation or protected field violation
  /api/v1/rbac/roles:
    get:
      summary: List RBAC roles and their permission keys.
      responses:
        "200":
          description: Role list
  /api/v1/rbac/permissions:
    get:
      summary: List platform permission keys.
      responses:
        "200":
          description: Permission list
  /api/v1/courses:
    get:
      summary: List courses in the current tenant.
      responses:
        "200":
          description: Course list
    post:
      summary: Create a draft course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreateInput"
      responses:
        "201":
          description: Course created
  /api/v1/courses/{courseId}/publish:
    post:
      summary: Publish a course after scenario and parameter checks.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course published
  /api/v1/courses/{courseId}/teams:
    post:
      summary: Create a team for a course.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Team created
  /api/v1/courses/{courseId}/runs:
    post:
      summary: Create a run and first draft round.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateInput"
      responses:
        "201":
          description: Run and round created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RunCreateEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Teacher run-create authority required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/start:
    post:
      summary: Start a draft round.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RoundEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/decisions:
    post:
      summary: Submit a validated team decision.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/M1DecisionSubmitRequest"
      responses:
        "201":
          description: Decision accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1DecisionSubmitSuccessEnvelope"
        "403":
          description: Student is not authorized for the requested team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "404":
          description: Run, round, or team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "409":
          description: Round is no longer open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: Decision validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/lock:
    post:
      summary: Lock a round for settlement.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RoundEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/settle:
    post:
      summary: Teacher command that requests structured-core settlement.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1SettlementResultEnvelope"
  /api/v1/bff/teacher/runs/{runId}/scenario-package-candidates:
    get:
      operationId: R7_TEACHER_SCENARIO_PACKAGE_CANDIDATES_GET_V1
      summary: List the Teacher-safe ScenarioPackage candidates for a run tenant.
      description: Read-only Teacher BFF projection. It does not assign or activate a ScenarioPackage, mutate a ParameterSet, execute Replay, or settle a round.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Minimal run-scoped ScenarioPackage candidate projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - run_id
                  - current_scenario_package_id
                  - candidates
                properties:
                  run_id:
                    type: string
                  current_scenario_package_id:
                    type:
                      - string
                      - "null"
                  candidates:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - scenario_package_id
                        - display_name
                        - version_label
                        - is_current
                      properties:
                        scenario_package_id:
                          type: string
                        display_name:
                          type: string
                        version_label:
                          type: string
                        is_current:
                          type: boolean
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
        "404":
          description: Run context not found or out of scope
        "503":
          description: Scenario candidate provider capability unavailable
  /api/v1/bff/teacher/formal-scenario-package-catalog:
    get:
      operationId: TEACHER_FORMAL_SCENARIO_PACKAGE_CATALOG_GET_V1
      summary: List approved formal ScenarioPackage authority references for the authenticated Teacher tenant.
      description: Read-only Teacher BFF projection. It creates no binding, writes no formal authority state, activates no Scenario runtime, and executes no Replay or settlement.
      responses:
        "200":
          description: Approved formal ScenarioPackage references safe for a local Teacher draft selection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - operation_id
                  - candidates
                  - explicit_non_proofs
                properties:
                  operation_id:
                    type: string
                    const: TEACHER_FORMAL_SCENARIO_PACKAGE_CATALOG_GET_V1
                  candidates:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - scenario_package_reference
                        - parameter_set_reference
                        - status
                        - schema_version
                        - compatibility_metadata
                        - plugin_dependencies
                      properties:
                        scenario_package_reference:
                          type: object
                          additionalProperties: false
                          required: [tenant_id, scenario_package_id, version, content_digest]
                          properties:
                            tenant_id: { type: string }
                            scenario_package_id: { type: string }
                            version: { type: string }
                            content_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
                        parameter_set_reference:
                          type: object
                          additionalProperties: false
                          required: [parameter_set_id, version, content_digest]
                          properties:
                            parameter_set_id: { type: string }
                            version: { type: string }
                            content_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
                        status:
                          type: string
                          const: APPROVED
                        schema_version:
                          type: string
                        compatibility_metadata:
                          type: object
                          additionalProperties: { type: string }
                        plugin_dependencies:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [plugin_package_id, version]
                            properties:
                              plugin_package_id: { type: string }
                              version: { type: string }
                  explicit_non_proofs:
                    type: array
                    items: { type: string }
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
  /api/v1/bff/teacher/formal-course-bindings/preview:
    post:
      operationId: TEACHER_FORMAL_COURSE_BINDING_PREVIEW_V1
      summary: Resolve a Teacher-safe, exact formal Course binding preview.
      description: The server re-resolves the selected immutable ScenarioPackage reference, its exact ParameterSet, available Plugin releases and the active JSON Engine profile. This endpoint is read-only.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherFormalCourseBindingPreviewInput"
      responses:
        "200":
          description: Exact formal binding preview without a Course or Run write.
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
        "422":
          description: Selected formal authority reference is unavailable or incompatible
  /api/v1/bff/teacher/formal-courses:
    post:
      operationId: TEACHER_FORMAL_COURSE_CREATE_V1
      summary: Create a formal-bound Course from one selected ScenarioPackage reference.
      description: The server resolves all hidden authority references and persists an append-only Course binding. Clients cannot submit Engine, ParameterSet or Plugin overrides.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherFormalCourseSelectionInput"
      responses:
        "201":
          description: Draft Course with a Teacher-safe formal binding summary.
        "401":
          description: Authentication required
        "403":
          description: Teacher authority required
        "422":
          description: Selected formal authority reference is unavailable or incompatible
  /api/v1/bff/teacher/course-blueprints:
    get:
      operationId: TEACHER_COURSE_BLUEPRINT_CATALOG_V1
      summary: List Teacher-safe approved CourseBlueprint versions for the request tenant.
      description: Read-only catalog. It excludes approval records, audit data, binding digests, and instructor-only guidance.
      security:
        - SessionBearer: []
      responses:
        "200": { description: "Teacher-safe approved CourseBlueprint catalog" }
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
  /api/v1/bff/teacher/course-blueprints/readiness:
    post:
      operationId: TEACHER_COURSE_BLUEPRINT_READINESS_V1
      summary: Resolve exact approved CourseBlueprint and B5 inputs without a write.
      description: Client-supplied Engine, ParameterSet, Plugin, and binding digest overrides are ignored; the server resolves every hidden formal input from exact authority references.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCourseBlueprintReadinessInput"
      responses:
        "200": { description: "Exact CourseBlueprint and formal Course readiness" }
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
        "422": { description: "Reference unavailable, retired, cross-tenant, or incompatible" }
  /api/v1/bff/teacher/course-blueprint-courses:
    post:
      operationId: TEACHER_COURSE_BLUEPRINT_COURSE_CREATE_V1
      summary: Create a draft Course with independent Blueprint and B5 formal bindings.
      description: Client-supplied hidden authority overrides are ignored and resolved server-side. JSON compensation removes the C1 binding when B5 creation fails; it is not a crash-safe durable transaction.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCourseBlueprintCourseCreateInput"
      responses:
        "201": { description: "Draft Course with Teacher-safe exact binding summaries" }
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
        "422": { description: "Invalid or unavailable exact authority inputs" }
  /api/v1/bff/teacher/course-blueprints/studio/preview:
    post:
      operationId: TEACHER_COURSE_BLUEPRINT_STUDIO_PREVIEW_V1
      summary: Preview an exact approved or in-progress CourseBlueprint version for Teacher editing.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCourseBlueprintStudioReferenceInput"
      responses:
        "200":
          description: "Teacher-safe exact CourseBlueprint Studio preview"
          content:
            application/json:
              schema:
                $ref: "../schemas/teacher-course-blueprint-studio.schema.json"
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
        "422": { description: "Reference unavailable, retired, cross-tenant, or digest-mismatched" }
  /api/v1/bff/teacher/course-blueprints/studio/drafts:
    post:
      operationId: TEACHER_COURSE_BLUEPRINT_STUDIO_DRAFT_CREATE_V1
      summary: Create a new immutable DRAFT version from one exact approved CourseBlueprint.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCourseBlueprintStudioDraftCreateInput"
      responses:
        "201":
          description: "Server-digested immutable CourseBlueprint DRAFT"
          content:
            application/json:
              schema:
                $ref: "../schemas/teacher-course-blueprint-studio.schema.json"
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
        "422": { description: "Invalid, non-monotonic, or unavailable exact source" }
  /api/v1/bff/teacher/course-blueprints/studio/submissions:
    post:
      operationId: TEACHER_COURSE_BLUEPRINT_STUDIO_SUBMIT_V1
      summary: Explicitly validate one exact Teacher-created DRAFT without freezing or approving it.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCourseBlueprintStudioReferenceInput"
      responses:
        "200":
          description: "Exact CourseBlueprint version transitioned to VALIDATED"
          content:
            application/json:
              schema:
                $ref: "../schemas/teacher-course-blueprint-studio.schema.json"
        "401": { description: "Authentication required" }
        "403": { description: "Teacher authority required" }
        "422": { description: "Reference unavailable, cross-tenant, or not in DRAFT state" }
  /api/v1/formal-authority/course-blueprints:
    post:
      operationId: FORMAL_COURSE_BLUEPRINT_DRAFT_CREATE_V1
