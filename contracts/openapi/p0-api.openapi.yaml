        - name: round_no
          in: query
          schema: { type: integer, minimum: 1 }
        - name: kpi
          in: query
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items: { $ref: "#/components/schemas/CourseReportKpi" }
      responses:
        "200":
          description: Admin Course Report with the shared safe projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseReportAdminEnvelope"
        "401":
          description: Authentication required
          x-simwar-course-report-error-codes: [COURSE_REPORT_AUTHENTICATION_REQUIRED]
          content: &course-report-error-content
            application/json:
              schema: { $ref: "#/components/schemas/CourseReportErrorEnvelope" }
        "403":
          description: tenant_admin or explicit platform_admin authority is required
          x-simwar-course-report-error-codes: [COURSE_REPORT_FORBIDDEN]
          content: *course-report-error-content
        "404":
          description: Course, Run, Team, or Round is not found in the authenticated scope
          x-simwar-course-report-error-codes: [COURSE_REPORT_NOT_FOUND]
          content: *course-report-error-content
        "422":
          description: Course Report filters are invalid
          x-simwar-course-report-error-codes: [COURSE_REPORT_INPUT_INVALID]
          content: *course-report-error-content
        "503":
          description: The active repository provider cannot expose report capabilities
          x-simwar-course-report-error-codes: [COURSE_REPORT_PROVIDER_UNSUPPORTED]
          content: *course-report-error-content
