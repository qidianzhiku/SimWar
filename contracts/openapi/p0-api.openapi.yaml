openapi: 3.1.0
info:
  title: SimWar P0/P1 API
  version: 0.1.0
  description: Minimal P0/P1 contract for the teacher-student-settlement loop plus tenant auth governance.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/auth/login:
    post:
      summary: Login and receive a signed session token.
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1AuthSessionEnvelope"
        "401":
          description: Missing, malformed, or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/auth/logout:
    post:
      summary: Revoke the current signed session.
      responses:
        "200":
          description: Session revoked
  /api/v1/auth/me:
    get:
      summary: Return the current authenticated user and effective permissions.
      responses:
        "200":
          description: Current user
  /api/v1/admin/state:
    get:
      summary: Return tenant, user, RBAC and audit state for an admin cockpit.
      responses:
        "200":
          description: Admin state
  /api/v1/admin/tenant-baselines/provision:
    post:
      operationId: ADMIN_TENANT_BASELINE_PROVISION_V1
      summary: Materialize one approved formal baseline as tenant-local immutable assets.
      description: Platform-admin governance ingress only. The caller supplies exact approved source ParameterSet and ScenarioPackage references plus a target tenant. The service materializes formal DRAFT, VALIDATED, FROZEN, and APPROVED snapshots through the existing authorities; it does not create a Course, Run, settlement, Replay, or truth record.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantBaselineProvisioningRequest"
      responses:
        "201":
          description: New approved tenant-local baseline materialization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBaselineProvisioningEnvelope"
        "200":
          description: Idempotent reuse of the exact completed materialization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBaselineProvisioningEnvelope"
        "401": { description: Authentication required }
        "403": { description: Platform baseline authority or source tenant scope denied }
        "404": { description: Target tenant or exact source authority reference not found }
        "409":
          {
            description: Deterministic target identity exists with conflicting or partial materialization
          }
        "422": { description: "Malformed, noncanonical, or unapproved source request" }
  /api/v1/admin/validation-environment-launches:
    post:
      operationId: ADMIN_VALIDATION_ENVIRONMENT_LAUNCH_CREATE_V1
      summary: Start or resume one durable Postgres-backed bounded validation environment launch.
      description: Requires explicit Postgres repository mode. The launch orchestrates existing baseline, Course, Run, cohort, role and validation-session authorities; it never creates a second truth, settlement, replay or Student authority.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationEnvironmentLaunchStartRequest"
      responses:
        "201":
          description: Durable launch reached its current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationEnvironmentLaunchEnvelope" }
        "409": { description: Conflicting retry or stale durable history }
        "422": { description: Invalid exact reference or cohort template }
        "503": { description: Postgres runtime is required }
  /api/v1/admin/validation-environment-launches/{launchId}:
    get:
      operationId: ADMIN_VALIDATION_ENVIRONMENT_LAUNCH_GET_V1
      summary: Read one tenant-scoped durable validation environment launch.
      security:
        - SessionBearer: []
      parameters:
        - name: launchId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Durable launch record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationEnvironmentLaunchEnvelope" }
        "404": { description: Launch not found }
  /api/v1/admin/course-factory/catalog:
    get:
      operationId: ADMIN_COURSE_FACTORY_CATALOG_V1
      summary: Read the tenant-scoped governed course catalog.
      description: Returns exact source references, lifecycle, rights, expiry and provenance for course factory versions. It never exposes user decisions, results or private source data.
      security:
        - SessionBearer: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
      responses:
        "200":
          description: Governed course catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryCatalogEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Admin tenant scope required }
  /api/v1/admin/course-factory/versions:
    post:
      operationId: ADMIN_COURSE_FACTORY_VERSION_CREATE_V1
      summary: Create one exact governed course package draft.
      description: Creates a CoursePackage draft through the existing CoursePackage registry and preserves exact source references. User decisions, results and private data are never copied.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseFactoryDraftInput" }
      responses:
        "201":
          description: Governed course factory draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryVersionEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Admin authority required }
        "409": { description: Exact package version already exists }
        "422": { description: "Invalid exact source, rights or metadata" }
  /api/v1/admin/course-factory/versions/clone:
    post:
      operationId: ADMIN_COURSE_FACTORY_VERSION_CLONE_V1
      summary: Clone one published governed course package into a draft.
      description: Requires an exact published source, active copy rights and an unexpired rights record. The clone uses the existing CoursePackage registry and carries lineage only.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseFactoryCloneInput" }
      responses:
        "201":
          description: Cloned governed course factory draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryVersionEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Copy rights or tenant scope denied }
        "409": { description: Source is not published or package identity conflicts }
        "422": { description: Invalid exact source reference }
  /api/v1/admin/course-factory/versions/rollback:
    post:
      operationId: ADMIN_COURSE_FACTORY_VERSION_ROLLBACK_V1
      summary: Create a rollback draft from an exact governed version.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseFactoryCloneInput" }
      responses:
        "201":
          description: Rollback governed course factory draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryVersionEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Copy rights or tenant scope denied }
        "409": { description: Source lifecycle is not rollback-eligible }
        "422": { description: Invalid exact source reference }
  /api/v1/admin/course-factory/versions/{coursePackageId}/versions/{version}/{action}:
    post:
      operationId: ADMIN_COURSE_FACTORY_VERSION_TRANSITION_V1
      summary: Apply one governed catalog lifecycle transition.
      description: Supported actions are validate, approve, publish, supersede and retire. The request body must carry the exact content digest and path identity.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
        - name: action
          in: path
          required: true
          schema: { enum: [validate, approve, publish, supersede, retire] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseFactoryTransitionReference" }
      responses:
        "200":
          description: Updated governed course version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryVersionEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Admin authority required }
        "409": { description: Invalid lifecycle transition or duplicate version }
        "422": { description: Invalid exact digest or request }
  /api/v1/admin/course-factory/versions/{coursePackageId}/versions/{version}/audit:
    get:
      operationId: ADMIN_COURSE_FACTORY_VERSION_AUDIT_V1
      summary: Read exact course factory lifecycle and lineage evidence.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
        - name: content_digest
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Exact lifecycle and lineage audit projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryAuditEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Admin authority required }
        "404": { description: Exact version not found }
  /api/v1/admin/course-factory/versions/{coursePackageId}/versions/{version}/export:
    get:
      operationId: ADMIN_COURSE_FACTORY_VERSION_EXPORT_V1
      summary: Export one exact governed course package when rights allow.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
        - name: content_digest
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Exact governed course version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryVersionEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Export rights or tenant scope denied }
        "404": { description: Exact version not found }
  /api/v1/bff/teacher/course-factory/catalog:
    get:
      operationId: BFF_TEACHER_COURSE_FACTORY_CATALOG_V1
      summary: Read the published governed course catalog for Teacher.
      security:
        - SessionBearer: []
      responses:
        "200":
          description: Teacher-safe published catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactoryTeacherCatalogEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Teacher tenant scope required }
  /api/v1/bff/enterprise/course-factory/sponsor:
    get:
      operationId: BFF_ENTERPRISE_COURSE_FACTORY_SPONSOR_V1
      summary: Read a sponsor-safe delivery and evidence aggregate.
      description: Returns bounded progress, exact source digest presence, known limits and catalog metadata without user decisions, results, scores, rankings or private source data.
      security:
        - SessionBearer: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
      responses:
        "200":
          description: Sponsor-safe aggregate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseFactorySponsorEnvelope" }
        "401": { description: Authentication required }
        "403": { description: Enterprise tenant scope required }
  /api/v1/admin/course-package-versions:
    get:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_LIST_V1
      summary: List tenant-scoped CoursePackageVersion lifecycle snapshots for administration.
      description: JSON-internal teaching/configuration records only. This does not expose a student route or modify source authority lifecycles.
      security:
        - SessionBearer: []
      responses:
        "200":
          description: Admin CoursePackageVersion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminListEnvelope"
        "401": { description: "Authentication required" }
        "403": { description: "Admin authority required" }
  /api/v1/admin/course-package-versions/drafts:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_DRAFT_CREATE_V1
      summary: Create one immutable DRAFT teaching package with closed exact source references.
      description: Tenant and actor are derived from the authenticated request. Existing CourseBlueprint, ScenarioPackage, ParameterSet, Course, and Run records are never written.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionDraftInput"
      responses:
        "201":
          description: Immutable DRAFT CoursePackageVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "401": { description: "Authentication required" }
        "403": { description: "Admin authority required" }
        "409": { description: "Exact package version already exists" }
        "422": { description: "Invalid closed reference or package content" }
  /api/v1/admin/course-package-versions/clone:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_CLONE_V1
      summary: Clone one exact AVAILABLE teaching package into a new immutable DRAFT.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionCloneInput"
      responses:
        "201":
          description: Cloned DRAFT CoursePackageVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact AVAILABLE source package not found" }
        "409":
          {
            description: "Target exact package version already exists or source package is not AVAILABLE"
          }
        "422": { description: "Source is not an exact AVAILABLE package" }
  /api/v1/admin/course-package-versions/import:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_IMPORT_V1
      summary: Import a digest-verified legacy package export as a new immutable DRAFT package version.
      description: Governed CourseFactory exports are not accepted by this generic import contract; use the existing CourseFactory authority for those packages.
      security:
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionImportInput"
      responses:
        "201":
          description: Imported DRAFT CoursePackageVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "409": { description: "Exact package version already exists" }
        "422": { description: "Import digest or source content is invalid" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/validate:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_VALIDATE_V1
      summary: Validate a DRAFT package against existing approved exact references.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionReferenceInput"
      responses:
        "200":
          description: VALIDATED CoursePackageVersion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact package version not found" }
        "409": { description: "Illegal package lifecycle transition" }
        "422": { description: "Dependency is unavailable or incompatible" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/make-available:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_AVAILABLE_V1
      summary: Mark one VALIDATED package AVAILABLE after a repeat dependency check.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionReferenceInput"
      responses:
        "200":
          description: AVAILABLE CoursePackageVersion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact package version not found" }
        "409": { description: "Illegal package lifecycle transition" }
        "422": { description: "Dependency is unavailable or incompatible" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/retire:
    post:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_RETIRE_V1
      summary: Retire one exact AVAILABLE teaching package without altering historical Courses.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePackageVersionReferenceInput"
      responses:
        "200":
          description: RETIRED CoursePackageVersion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionAdminEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact package version not found" }
        "409": { description: "Illegal package lifecycle transition" }
  /api/v1/admin/course-package-versions/{coursePackageId}/versions/{version}/export:
    get:
      operationId: ADMIN_COURSE_PACKAGE_VERSION_EXPORT_V1
      summary: Export one exact AVAILABLE immutable teaching package.
      security:
        - SessionBearer: []
      parameters:
        - name: coursePackageId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactIdentity" }
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CoursePackageExactVersion" }
        - name: content_digest
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Digest-verified CoursePackageVersion export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePackageVersionExportEnvelope"
        "403": { description: "Admin or tenant scope denied" }
        "404": { description: "Exact AVAILABLE package not found" }
  /api/v1/admin/tenants:
    get:
      summary: List tenants visible to the current administrator.
      responses:
        "200":
          description: Tenant list
    post:
      summary: Create a tenant. Requires platform_admin and tenant:create.
      responses:
        "201":
          description: Tenant created
        "403":
          description: Missing tenant:create permission
  /api/v1/admin/tenants/{tenantId}:
    get:
      summary: Read one tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant detail
  /api/v1/admin/users:
    get:
      summary: List users in the current tenant, or all users for platform_admin.
      responses:
        "200":
          description: User list
    post:
      summary: Create a tenant-scoped user and assign roles.
      responses:
        "201":
          description: User created
        "403":
          description: Role escalation or permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "422":
          description: Missing required user credential or invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/admin/users/{userId}:
    patch:
      summary: Update a user profile, status, password or roles with field-level checks.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User updated
        "403":
          description: Tenant boundary, role escalation or protected field violation
  /api/v1/rbac/roles:
    get:
      summary: List RBAC roles and their permission keys.
      responses:
        "200":
          description: Role list
  /api/v1/rbac/permissions:
    get:
      summary: List platform permission keys.
      responses:
        "200":
          description: Permission list
  /api/v1/courses:
    get:
      summary: List courses in the current tenant.
      responses:
        "200":
          description: Course list
    post:
      summary: Create a draft course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreateInput"
      responses:
        "201":
          description: Course created
  /api/v1/courses/{courseId}/publish:
    post:
      summary: Publish a course after scenario and parameter checks.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course published
  /api/v1/courses/{courseId}/teams:
    post:
      summary: Create a team for a course.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Team created
  /api/v1/courses/{courseId}/teams/{teamId}/members:
    post:
      operationId: COURSE_TEAM_MEMBER_ADD_V1
      summary: Add one tenant-local learner to an existing course team.
      description: Adds a member through the existing team authority. It does not assign a RoleWorkflow assignment, write truth, or create a student route.
      security:
        - SessionBearer: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: teamId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberEnrollmentInput"
      responses:
        "201": { description: Team with the enrolled member }
        "403": { description: Team authority required }
        "409": { description: "Duplicate member, role slot, or cross-team enrollment" }
  /api/v1/bff/teacher/fresh-learner-admission:
    get:
      operationId: FRESH_LEARNER_ADMISSION_READINESS_GET_V1
      summary: Read teacher-safe fresh learner E4 admission readiness.
      description: Read-only projection over exact Course, Run, Team membership, Identity status, and existing RoleWorkflow assignments. It never exposes passwords, raw private payloads, truth fields, settlement, replay, or Student-only data.
      security:
        - SessionBearer: []
      parameters:
        - name: course_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: run_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: team_ids
          in: query
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Teacher-safe admission readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreshLearnerAdmissionEnvelope"
        "403": { description: Teacher or tenant-admin scope required }
        "404": { description: "Course, run, or selected team not found" }
  /api/v1/courses/{courseId}/runs:
    post:
      summary: Create a run and first draft round.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreateInput"
      responses:
        "201":
          description: Run and round created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M1RunCreateEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        "403":
          description: Teacher run-create authority required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
  /api/v1/runs/{runId}/rounds/{roundNo}/start:
    post:
      summary: Start a draft round.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: roundNo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round opened
          content:
