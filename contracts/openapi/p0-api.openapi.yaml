  /api/v1/bff/teacher/courses/{courseId}/project-library:
    get:
      operationId: TEACHER_PROJECT_LIBRARY_GET_V1
      summary: Read the exact tenant-scoped Project Profile library for a Course.
      description: Teacher projection of versioned project provenance and safe configuration. Project Profile is not Runtime Authority; exact CoursePackage and FormalRunRuntimeBinding remain authoritative.
      security:
        - SessionBearer: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Project Profile library projection
          content:
            application/json:
              schema:
                type: object
                required: [request_id, code, message, data]
                properties:
                  request_id: { type: string }
                  code: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    required: [course_id, profiles]
                    properties:
                      course_id: { type: string }
                      profiles:
                        type: array
                        items:
                          type: object
                          required:
                            [
                              description,
                              market_world_reference,
                              project_profile_reference,
                              readiness,
                              status,
                              title,
                              version
                            ]
                          properties:
                            description: { type: string }
                            market_world_reference:
                              $ref: "../schemas/market-world.v1.json#/$defs/marketWorldRef"
                            project_profile_reference:
                              $ref: "../schemas/project-profile.v1.json#/$defs/projectProfileRef"
                            readiness:
                              type: array
                              items: { type: string }
                            status: { type: string, enum: [DRAFT, VALIDATED, RETIRED] }
                            successor_of:
                              $ref: "../schemas/project-profile.v1.json#/$defs/projectProfileRef"
                            title: { type: string }
                            version: { type: string }
        "401": { description: Authentication required }
        "403": { description: Teacher or tenant administrator authority required }
        "404": { description: Course not found in tenant scope }
    post:
      operationId: TEACHER_PROJECT_LIBRARY_CREATE_V1
      summary: Append one normalized safe Project Profile draft.
      description: The command accepts a closed normalized object only. Raw source paths, restricted source data and runtime truth fields are rejected.
      security:
        - SessionBearer: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_profile]
              properties:
                project_profile:
                  type: object
                  additionalProperties: false
                  required:
                    [
                      customer_segment,
                      description,
                      geography,
                      industry,
                      market_world_reference,
                      positioning,
                      project_profile_id,
                      service_bundle,
                      starting_capacity,
                      starting_cash,
                      template_id,
                      title,
                      version
                    ]
                  properties:
                    customer_segment: { type: string }
                    description: { type: string }
                    geography: { type: string }
                    industry: { type: string }
                    market_world_reference:
                      $ref: "../schemas/market-world.v1.json#/$defs/marketWorldRef"
                    positioning: { type: string }
                    project_profile_id: { type: string }
                    service_bundle: { type: string }
                    starting_capacity: { type: number, minimum: 0 }
                    starting_cash: { type: number, minimum: 0 }
                    template_id: { type: string }
                    title: { type: string }
                    version: { type: string }
      responses:
        "201":
          description: Draft Project Profile appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProfileEnvelope"
        "401": { description: Authentication required }
        "403": { description: Teacher authority required }
        "409": { description: Duplicate immutable identity }
        "422": { description: Invalid or unsafe normalized profile }
