components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      description: Signed user session. Tenant scope is resolved by the server from this identity.
    InternalServiceBearer:
      type: http
      scheme: bearer
      description: Internal service token only. Public browser clients must not receive or use this credential.
    ServicePrincipalHeader:
      type: apiKey
      in: header
      name: X-Service-Principal
      description: Must identify the service kernel principal for internal settlement.
  schemas:
    FormalCourseBlueprintReferenceInput:
      type: object
      additionalProperties: true
      description: Unknown fields are ignored; the server validates and resolves the exact reference fields.
      required: [tenant_id, course_blueprint_id, version, content_digest]
      properties:
        tenant_id:
          type: string
          minLength: 1
        course_blueprint_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        content_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
    FormalCourseBlueprintApprovalInput:
      type: object
      additionalProperties: true
      description: Unknown fields are ignored. approval_id is required for the approve action.
      required: [tenant_id, course_blueprint_id, version, content_digest, approval_id]
      properties:
        tenant_id:
          type: string
          minLength: 1
        course_blueprint_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        content_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        approval_id:
          type: string
          minLength: 1
    TeacherCourseBlueprintReadinessInput:
      type: object
      additionalProperties: true
      description: Unknown client fields are ignored; hidden formal inputs are always resolved server-side.
      required: [course_blueprint_reference, scenario_package_reference]
      properties:
        course_blueprint_reference:
          $ref: "#/components/schemas/FormalCourseBlueprintReferenceInput"
        scenario_package_reference:
          $ref: "#/components/schemas/FormalScenarioPackageReferenceInput"
    TeacherCourseBlueprintCourseCreateInput:
      type: object
      additionalProperties: true
      description: Unknown client fields are ignored; hidden formal inputs are always resolved server-side.
      required: [course_blueprint_reference, scenario_package_reference, title]
      properties:
        course_blueprint_reference:
          $ref: "#/components/schemas/FormalCourseBlueprintReferenceInput"
        scenario_package_reference:
          $ref: "#/components/schemas/FormalScenarioPackageReferenceInput"
        title:
          type: string
          minLength: 1
    TeacherFormalCourseBindingPreviewInput:
      type: object
      additionalProperties: false
      required: [scenario_package_reference]
      properties:
        scenario_package_reference:
          $ref: "#/components/schemas/FormalScenarioPackageReferenceInput"
    TeacherFormalCourseSelectionInput:
      type: object
      additionalProperties: false
      required: [scenario_package_reference, title]
      properties:
        scenario_package_reference:
          $ref: "#/components/schemas/FormalScenarioPackageReferenceInput"
        title:
          type: string
          minLength: 1
    FormalParameterSetBindingReferenceInput:
      type: object
      additionalProperties: false
      required: [parameter_set_id, version, content_digest]
      properties:
        parameter_set_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        content_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
    FormalCourseAuthorityBindingInput:
      type: object
      additionalProperties: false
      required: [engine_reference, parameter_set_reference, scenario_package_reference]
      properties:
        engine_reference:
          type: object
          additionalProperties: false
          required: [engine_id, version]
          properties:
            engine_id:
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
        parameter_set_reference:
          $ref: "#/components/schemas/FormalParameterSetBindingReferenceInput"
        scenario_package_reference:
          $ref: "#/components/schemas/FormalScenarioPackageReferenceInput"
    CourseCreateInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        formal_authority_binding:
          $ref: "#/components/schemas/FormalCourseAuthorityBindingInput"
      description: A formal authority binding is append-only and freezes exact ScenarioPackage, ParameterSet, and engine references for this Course. It does not start a Run or activate a plugin runtime.
    RunCreateInput:
      type: object
      additionalProperties: false
      properties:
        formal_runtime_seed:
          type: integer
          minimum: 0
          description: Required only for a Course with a formal authority binding. The server derives exact authority references from the immutable Course binding.
        formal_runtime_binding:
          $ref: "#/components/schemas/FormalRunRuntimeBindingInput"
    FormalRunRuntimeBindingInput:
      type: object
      additionalProperties: false
      required: [engine_reference, parameter_set_reference, scenario_package_reference, seed]
      properties:
        engine_reference:
          type: object
          additionalProperties: false
          required: [engine_id, version]
          properties:
            engine_id:
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
        parameter_set_reference:
          $ref: "#/components/schemas/FormalParameterSetBindingReferenceInput"
        scenario_package_reference:
          $ref: "#/components/schemas/FormalScenarioPackageReferenceInput"
        seed:
          type: integer
          minimum: 0
      description: Legacy-compatible explicit formal Run binding. It is rejected when the Course already has a formal authority binding, so callers cannot override frozen Course references.
    FormalParameterSetReferenceInput:
      type: object
      additionalProperties: false
      required: [tenant_id, parameter_set_id, version, content_digest]
      properties:
        tenant_id:
          type: string
          minLength: 1
        parameter_set_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        content_digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
    FormalParameterSetApprovalInput:
