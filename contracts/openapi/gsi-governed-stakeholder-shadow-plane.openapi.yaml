openapi: 3.1.0
info:
  title: SimWar Governed Stakeholder Shadow Plane
  version: 1.0.0
paths:
  /api/v1/bff/teacher/gsi/candidates:
    post:
      summary: Create a bounded Provider-OFF GSI candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GSIRequest"
      responses:
        "201":
          description: Candidate receipt
  /api/v1/bff/teacher/gsi/candidates/{candidateId}:
    get:
      summary: Read Teacher-safe GSI diagnostics
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: Teacher-safe receipt
  /api/v1/bff/teacher/gsi/candidates/compare:
    get:
      summary: Read an exact descriptive cross-round comparison
      parameters:
        - $ref: "#/components/parameters/FromCandidateId"
        - $ref: "#/components/parameters/ToCandidateId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/RoleKey"
        - $ref: "#/components/parameters/ExpectedComparisonDigest"
        - $ref: "#/components/parameters/ExpectedContextDigest"
      responses:
        "200":
          description: Teacher-safe cross-round comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GSICrossRoundTeacherProjection"
  /api/v1/bff/student/gsi/candidates/{candidateId}:
    get:
      summary: Read published role-safe GSI projection
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: Student-safe projection
  /api/v1/bff/student/gsi/candidates/compare:
    get:
      summary: Read a role-safe descriptive cross-round comparison
      parameters:
        - $ref: "#/components/parameters/FromCandidateId"
        - $ref: "#/components/parameters/ToCandidateId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/RoleKey"
        - $ref: "#/components/parameters/ExpectedComparisonDigest"
        - $ref: "#/components/parameters/ExpectedContextDigest"
      responses:
        "200":
          description: Student-safe cross-round comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GSICrossRoundStudentProjection"
  /api/v1/bff/admin/gsi/audit:
    get:
      summary: Read tenant-safe GSI provenance
      parameters:
        - in: query
          name: candidate_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Admin-safe projection
  /api/v1/bff/admin/gsi/candidates/compare:
    get:
      summary: Read an exact cross-round comparison with audit context
      parameters:
        - $ref: "#/components/parameters/FromCandidateId"
        - $ref: "#/components/parameters/ToCandidateId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/RoleKey"
        - $ref: "#/components/parameters/ExpectedComparisonDigest"
        - $ref: "#/components/parameters/ExpectedContextDigest"
      responses:
        "200":
          description: Admin-safe cross-round comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GSICrossRoundAdminProjection"
components:
  parameters:
    CandidateId:
      in: path
      name: candidateId
      required: true
      schema:
        type: string
    FromCandidateId:
      in: query
      name: from_candidate_id
      required: true
      schema: { type: string }
    ToCandidateId:
      in: query
      name: to_candidate_id
      required: true
      schema: { type: string }
    ActivityId:
      in: query
      name: activity_id
      required: true
      schema: { type: string }
    RoleKey:
      in: query
      name: role_key
      required: true
      schema: { type: string }
    ExpectedComparisonDigest:
      in: query
      name: expected_comparison_digest
      required: false
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    ExpectedContextDigest:
      in: query
      name: expected_context_digest
      required: false
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }
  schemas:
    GSIRequest:
      type: object
      additionalProperties: false
      required: [discriminator, binding, plane_mode, publication_status, proposals, idempotency_key]
      properties:
        discriminator:
          const: gsi_stakeholder_shadow_request
        binding:
          type: object
          additionalProperties: false
          required:
            [
              tenant_id,
              course_id,
              run_id,
              round_id,
              team_id,
              scenario_package_id,
              scenario_version,
              parameter_set_id,
              parameter_set_version,
              model_version_id,
              model_version,
              model_artifact_id,
              model_artifact_version
            ]
          properties:
            tenant_id: { type: string }
            course_id: { type: string }
            run_id: { type: string }
            round_id: { type: string }
            team_id: { type: string }
            scenario_package_id: { type: string }
            scenario_version: { type: string }
            parameter_set_id: { type: string }
            parameter_set_version: { type: string }
            model_version_id: { type: string }
            model_version: { type: string }
            model_artifact_id: { type: string }
            model_artifact_version: { type: string }
        plane_mode: { enum: [OFF, SHADOW] }
        publication_status: { enum: [DRAFT, PUBLISHED] }
        proposals:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [proposal_id, stakeholder_type, intent, priority, influence, summary]
            properties:
              proposal_id: { type: string }
              stakeholder_type: { enum: [customer, regulator, bank, employee, media] }
              intent:
                {
                  enum:
                    [
                      protect_demand,
                      reduce_regulatory_risk,
                      preserve_liquidity,
                      retain_workforce,
                      protect_reputation
                    ]
                }
              priority: { type: number, minimum: 0, maximum: 1 }
              influence: { type: number, minimum: -1, maximum: 1 }
              summary: { type: string, minLength: 1, maxLength: 240 }
        idempotency_key: { type: string }
    GSICrossRoundMovement:
      type: object
      additionalProperties: false
      required: [signal_key, stakeholder_type, intent, direction]
      properties:
        signal_key: { type: string }
        stakeholder_type: { enum: [customer, regulator, bank, employee, media] }
        intent:
          {
            enum:
              [
                protect_demand,
                reduce_regulatory_risk,
                preserve_liquidity,
                retain_workforce,
                protect_reputation
              ]
          }
        from_value: { type: number, minimum: -1, maximum: 1 }
        to_value: { type: number, minimum: -1, maximum: 1 }
        delta: { type: number, minimum: -2, maximum: 2 }
        direction: { enum: [NEW, REMOVED, INCREASED, DECREASED, STABLE] }
    GSICrossRoundComparison:
      type: object
      additionalProperties: false
      required:
        [discriminator, pair, movements, comparison_digest, non_causal, causal_proof, known_limits]
      properties:
        discriminator: { const: gsi_cross_round_comparison }
        pair: { type: object }
        movements:
          type: array
          items: { $ref: "#/components/schemas/GSICrossRoundMovement" }
        comparison_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
        non_causal: { const: true }
        causal_proof: { const: false }
        known_limits: { type: array, minItems: 1, items: { type: string } }
    GSICrossRoundContext:
      type: object
      additionalProperties: false
      required:
        [
          status,
          anchors,
          context_digest,
          non_causal,
          causal_proof,
          official_outcome_recomputed,
          official_truth_write,
          recovery,
          known_limits
        ]
      properties:
        status: { enum: [AVAILABLE, CONTEXT_UNAVAILABLE, REBASE_REQUIRED] }
        context:
          type: object
          additionalProperties: false
          required:
            [activity_id, course_id, role_key, round_id, round_no, run_id, team_id, tenant_id]
          properties:
            activity_id: { type: string }
            course_id: { type: string }
            role_key: { type: string }
            round_id: { type: string }
            round_no: { type: integer, minimum: 1 }
            run_id: { type: string }
            team_id: { type: string }
            tenant_id: { type: string }
        anchors: { type: array, items: { type: object } }
        context_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
        non_causal: { const: true }
        causal_proof: { const: false }
        official_outcome_recomputed: { const: false }
        official_truth_write: { const: false }
        recovery: { enum: [RELOAD_EXACT_CONTEXT, WAIT_FOR_PUBLICATION] }
        known_limits: { type: array, minItems: 1, items: { type: string } }
    GSICrossRoundAdminContext:
      type: object
      additionalProperties: false
      required:
        [
          status,
          context,
          anchors,
          context_digest,
          non_causal,
          causal_proof,
          official_outcome_recomputed,
          official_truth_write,
          recovery,
          known_limits,
          context_binding
        ]
      properties:
        status: { enum: [AVAILABLE, CONTEXT_UNAVAILABLE, REBASE_REQUIRED] }
        context:
          type: object
          additionalProperties: false
          required:
            [activity_id, course_id, role_key, round_id, round_no, run_id, team_id, tenant_id]
          properties:
            activity_id: { type: string }
            course_id: { type: string }
            role_key: { type: string }
            round_id: { type: string }
            round_no: { type: integer, minimum: 1 }
            run_id: { type: string }
            team_id: { type: string }
            tenant_id: { type: string }
        anchors: { type: array, items: { type: object } }
        context_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
        non_causal: { const: true }
        causal_proof: { const: false }
        official_outcome_recomputed: { const: false }
        official_truth_write: { const: false }
        recovery: { enum: [RELOAD_EXACT_CONTEXT, WAIT_FOR_PUBLICATION] }
        known_limits: { type: array, minItems: 1, items: { type: string } }
        context_binding:
          type: object
          additionalProperties: false
          required:
            [activity_id, course_id, role_key, round_id, round_no, run_id, team_id, tenant_id]
          properties:
            activity_id: { type: string }
            course_id: { type: string }
            role_key: { type: string }
            round_id: { type: string }
            round_no: { type: integer, minimum: 1 }
            run_id: { type: string }
            team_id: { type: string }
            tenant_id: { type: string }
    GSICrossRoundTeacherProjection:
      type: object
      required:
        [surface, comparison, context, provider, official_truth_write, known_limits, recovery]
      properties:
        surface: { const: teacher }
        comparison: { $ref: "#/components/schemas/GSICrossRoundComparison" }
        context: { $ref: "#/components/schemas/GSICrossRoundContext" }
        provider: { const: OFF }
        official_truth_write: { const: false }
        known_limits: { type: array, minItems: 1, items: { type: string } }
        recovery: { enum: [RELOAD_EXACT_CONTEXT, WAIT_FOR_PUBLICATION] }
    GSICrossRoundStudentProjection:
      type: object
      required:
        [
          surface,
          movements,
          context_status,
          non_causal,
          causal_proof,
          provider,
          official_truth_write,
          known_limits,
          recovery
        ]
      properties:
        surface: { const: student }
        movements:
          { type: array, items: { $ref: "#/components/schemas/GSIStudentCrossRoundMovement" } }
        context_status: { enum: [AVAILABLE, CONTEXT_UNAVAILABLE, REBASE_REQUIRED] }
        non_causal: { const: true }
        causal_proof: { const: false }
        provider: { const: OFF }
        official_truth_write: { const: false }
        known_limits: { type: array, minItems: 1, items: { type: string } }
        recovery: { enum: [RELOAD_EXACT_CONTEXT, WAIT_FOR_PUBLICATION] }
    GSICrossRoundAdminProjection:
      type: object
      required:
        [
          surface,
          tenant_id,
          comparison,
          context,
          provider,
          official_truth_write,
          known_limits,
          recovery
        ]
      properties:
        surface: { const: admin }
        tenant_id: { type: string }
        comparison: { $ref: "#/components/schemas/GSICrossRoundComparison" }
        context: { $ref: "#/components/schemas/GSICrossRoundAdminContext" }
        provider: { const: OFF }
        official_truth_write: { const: false }
        known_limits: { type: array, minItems: 1, items: { type: string } }
        recovery: { enum: [RELOAD_EXACT_CONTEXT, WAIT_FOR_PUBLICATION] }
    GSIStudentCrossRoundMovement:
      type: object
      additionalProperties: false
      required: [stakeholder_type, intent, direction]
      properties:
        stakeholder_type: { enum: [customer, regulator, bank, employee, media] }
        intent:
          {
            enum:
              [
                protect_demand,
                reduce_regulatory_risk,
                preserve_liquidity,
                retain_workforce,
                protect_reputation
              ]
          }
        from_value: { type: number, minimum: -1, maximum: 1 }
        to_value: { type: number, minimum: -1, maximum: 1 }
        delta: { type: number, minimum: -2, maximum: 2 }
        direction: { enum: [NEW, REMOVED, INCREASED, DECREASED, STABLE] }
