state_machines:
  - state_machine_id: SM-01
    aggregate: ParameterSet
    allowed_path: DRAFT → VALIDATED → FROZEN → APPROVED → RETIRED
    writer: ParameterSetCommandService
    negative_cases: invalid transition, digest/reference mismatch, actor scope
  - state_machine_id: SM-02
    aggregate: ScenarioPackage
    allowed_path: DRAFT → VALIDATED → FROZEN → APPROVED → RETIRED
    writer: ScenarioPackageCommandService
    negative_cases: unapproved ParameterSet, tenant mismatch, forbidden content
  - state_machine_id: SM-03
    aggregate: PluginRelease
    allowed_path: DRAFT → VALIDATED → APPROVED → AVAILABLE → RETIRED
    writer: PluginReleaseCommandService
    negative_cases: unapproved/unavailable release, digest conflict
  - state_machine_id: SM-04
    aggregate: Course Binding
    allowed_path: ABSENT → APPENDED_EXACT_BINDING; no update
    writer: FormalCourseAuthorityBindingStore
    negative_cases: second append, client override
  - state_machine_id: SM-05
    aggregate: Run/Round
    allowed_path: CREATED → OPEN/STARTED → LOCKED → SETTLED → PUBLISHED; bounded terminal/error states
    writer: Run/Round command path
    negative_cases: illegal order, concurrency, duplicate settlement
  - state_machine_id: SM-06
    aggregate: Decision
    allowed_path: DRAFT/VALIDATED/SUBMITTED or current equivalent → canonical whole-team decision
    writer: Decision command path
    negative_cases: late/wrong-team/duplicate conflict
  - state_machine_id: SM-07
    aggregate: Settlement
    allowed_path: NOT_COMMITTED → ATOMIC_COMMIT; idempotent replay/read
    writer: SettlementOutcomePersistencePort
    negative_cases: duplicate business identity, partial commit
  - state_machine_id: SM-08
    aggregate: Replay
    allowed_path: PENDING → RUNNING → COMPLETED/MATCHED|MISMATCHED|FAILED
    writer: Replay repository/evidence path
    negative_cases: official result write forbidden
  - state_machine_id: SM-09
    aggregate: Abort/Reset/Cleanup
    allowed_path: current synthetic states → ABORTED/RESET/CLEANED with preserved audit and bounded ephemeral removal
    writer: SyntheticRunLifecycle
    negative_cases: cross-tenant action, formal authority mutation, residue
validation_tiers:
  A_FOCUSED_RED:
    - smallest failing test
    - failure reason matches intended gap
  B_FOCUSED_GREEN:
    - focused test
    - direct affected tests
  C_PR_CANDIDATE:
    - check:hidden-unicode
    - check:direct-store-boundaries
    - lint
    - typecheck
    - tests
    - test:contract
    - build
    - security
    - Playwright when applicable
  D_EXACT_HEAD:
    - exact base/head/files
    - CI
    - CodeQL
    - review threads
    - negative matrix
    - mergeability
  E_POST_MERGE:
    - fresh clone
    - npm ci
    - targeted/full/build/browser as applicable
    - clean
    - zero residue
    - merge receipt
graph_query_playbook:
  - query_id: Q-REPO-01
    purpose: Repository module and hotspot map
    graphify_intent: Map folders/modules, dependency fan-in/fan-out, cycles and duplicate registries
    codegraph_intent: Trace imports/exports and public symbols
    expected_output: Module map + collision candidates
    stop_condition: Graph SHA drift
  - query_id: Q-AUTH-01
    purpose: Sole writer audit
    graphify_intent: Connect Authority objects to adapters, routes and consumers
    codegraph_intent: Find every definition/caller/mutation of command services and persistence methods
    expected_output: Writer table + second-writer findings
    stop_condition: Any unresolved writer
  - query_id: Q-RUNTIME-01
    purpose: Formal Golden call path
    graphify_intent: Map authority→Course→Run→Decision→Settlement→Projection→Replay
    codegraph_intent: Trace route→handler→service→repo for exact symbols
    expected_output: Exact path and missing edges
    stop_condition: Fallback or unknown edge
  - query_id: Q-STUDENT-01
    purpose: Student private-field exposure
    graphify_intent: Map DTO/schema/BFF/UI/error/log/export consumers
    codegraph_intent: Search protected markers and serialization paths
    expected_output: Deny matrix and reachable paths
    stop_condition: Any reachable private marker
  - query_id: Q-TEST-01
    purpose: Test traceability
    graphify_intent: Map capability/source/test/script/workflow relationships
    codegraph_intent: Find references to symbols from test cases and npm/CI invocations
    expected_output: Coverage graph and orphan tests
    stop_condition: Critical capability has no test
  - query_id: Q-CAND-01
