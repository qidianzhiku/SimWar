gaps:
  - gap_id: BLP-M0-GAP-001
    capability: BLP implementation identity
    current_state: No production BLP or PyBLP source, dependency, adapter, or callable symbol is proven.
    classification: UNKNOWN
    future_gate: T4_MODEL_ARCHITECTURE_AND_DEPENDENCY_DECISION
    required_evidence:
      - exact package and source identity
      - license and provenance
      - deterministic adapter contract
    blocks_c2: false
    reason_not_blocking_c2: C2 uses existing CourseBlueprint and formal binding surfaces.

  - gap_id: BLP-M0-GAP-002
    capability: Formal ModelVersion authority
    current_state: model_version_ref is a string; no lifecycle authority or registry is proven.
    classification: UNKNOWN
    future_gate: T4_MODEL_VERSION_AUTHORITY_DECISION
    required_evidence:
      - sole writer
      - lifecycle state machine
      - immutable artifact digest
      - tenant and approval rules
    blocks_c2: false
    reason_not_blocking_c2: C2 does not create or mutate model versions.

  - gap_id: BLP-M0-GAP-003
    capability: BLP artifact registry and provenance
    current_state: No digest-addressed BLP artifact registry is proven.
    classification: UNKNOWN
    future_gate: MODEL_ARTIFACT_PROVENANCE_GATE
    required_evidence:
      - artifact digest
      - source data provenance
      - calibration environment
      - reproducible build
      - rollback identity
    blocks_c2: false
    reason_not_blocking_c2: Teacher Blueprint Studio does not resolve model artifacts.

  - gap_id: BLP-M0-GAP-004
    capability: ParameterSet to BLP compatibility
    current_state: Formal ParameterSet binding exists, but active runtime only accepts model_family toy_logit.
    classification: REFERENCE
    future_gate: PARAMETERSET_MODEL_COMPATIBILITY_GATE
    required_evidence:
      - BLP parameter schema
      - feature mapper version
      - solver version
      - exact ModelVersion reference
      - fail-closed resolver behavior
    blocks_c2: false
    reason_not_blocking_c2: C2 edits only already-supported Blueprint content.

  - gap_id: BLP-M0-GAP-005
    capability: BLP Golden Solver
    current_state: Current Golden proves toy_logit only.
    classification: UNKNOWN
    future_gate: BLP_GOLDEN_SOLVER_GATE
    required_evidence:
      - fixed inputs
      - expected outputs
      - numeric tolerance
      - repeatability
      - independent implementation review
    blocks_c2: false
    reason_not_blocking_c2: C2 Golden non-interference remains bound to the existing engine.

  - gap_id: BLP-M0-GAP-006
    capability: BLP Shadow Replay
    current_state: No executable BLP Shadow Replay route or pipeline is proven.
    classification: UNKNOWN
    future_gate: BLP_SHADOW_REPLAY_NON_OVERWRITE_GATE
    required_evidence:
      - isolated candidate inputs
      - diff report
      - official result non-overwrite
      - approval threshold
      - historical binding identity
    blocks_c2: false
    reason_not_blocking_c2: C2 neither runs nor approves model candidates.

  - gap_id: BLP-M0-GAP-007
    capability: BLP active-runtime adapter
    current_state: Active runtime directly creates the toy-logit engine.
    classification: UNKNOWN
    future_gate: T4_RUNTIME_ADAPTER_ACTIVATION_DECISION
    required_evidence:
      - single engine selection authority
      - no silent fallback
      - bounded resource behavior
      - rollback path
      - full Golden and Replay regression
    blocks_c2: false
    reason_not_blocking_c2: Runtime adapter activation is outside C2 scope.

  - gap_id: BLP-M0-GAP-008
    capability: BLP tenant and role-safe diagnostics
    current_state: BLP diagnostic projection DTOs and enforcement are not proven.
    classification: UNKNOWN
    future_gate: MODEL_DIAGNOSTIC_VISIBILITY_GATE
    required_evidence:
      - teacher projection allowlist
      - student denylist
      - tenant isolation
      - no hidden parameter exposure
      - audit trail
    blocks_c2: false
    reason_not_blocking_c2: C2 must not expose model diagnostics.

  - gap_id: BLP-M0-GAP-009
    capability: Calibration and predictive validity
    current_state: No calibration dataset, run, diagnostic, or validity evidence was executed in M0.
    classification: UNKNOWN
    future_gate: OWNER_AUTHORIZED_CALIBRATION_AND_VALIDATION
    required_evidence:
      - synthetic or approved data policy
      - calibration protocol
      - holdout evaluation
      - bias and stability diagnostics
      - human review
    blocks_c2: false
    reason_not_blocking_c2: C2 is a product workflow over current approved assets.

  - gap_id: BLP-M0-GAP-010
    capability: Stage 4B deterministic runtime preference bridge
    current_state: Candidate architecture exists in the external plan; no current Resolver, Runtime Preference State authority, or BLP bridge is proven.
    classification: REFERENCE
    future_gate: M_STK_JOIN_GATE_AFTER_M_RB3
    required_evidence:
      - Agent proposal cannot mutate ModelVersion or ParameterSet
      - deterministic bounded resolver
      - versioned and expiring Runtime Preference State
      - DemandEstimate candidate only
      - Simulation Core L1 acceptance
      - plane-off and zero-signal exact parity
      - official replay provider calls equal zero
    blocks_c2: false
    reason_not_blocking_c2: STK S0 is read-only and future S2 waits for M-RB3.

  - gap_id: BLP-M0-GAP-011
    capability: Exact formal identity coverage for legacy unbound runs
    current_state: resolveRunRuntimeInputs uses exact formal authority when a FormalRunRuntimeBinding exists, but active legacy runs without a binding fall back to repository lookups by scenario-package and parameter-set IDs; settlement and Replay evidence consume both paths.
    classification: KNOWN_COMPATIBILITY_GAP
    future_gate: FORMAL_RUN_BINDING_FALLBACK_ELIMINATION_GATE
    required_evidence:
      - inventory of legacy unbound runs
      - explicit migration or retirement policy
      - fail-closed behavior after fallback removal
      - settlement and Replay parity for migrated runs
      - no silent ID-only runtime resolution
    blocks_c2: false
    reason_not_blocking_c2: C2 and C3 product closures do not activate BLP or alter the legacy compatibility path.

