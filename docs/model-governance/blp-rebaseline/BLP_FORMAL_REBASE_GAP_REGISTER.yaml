  - BLP is calibrated.
  - ModelVersion authority is complete.
  - Shadow Replay is complete.
  - DemandEstimate candidate is implemented.
  - Stage 4B Resolver or Runtime Preference State is implemented.
  - M-RB0 through M-RB3 have passed.
  - Real-industry validity is proven.
  - Pilot or Production is authorized.
